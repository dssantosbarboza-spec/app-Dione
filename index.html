DB.menuActions=function(){const foot=document.querySelector('.drawerFoot');const file=document.getElementById('importFile');if(file)file.remove();const theme=state.dbSettings.dark;foot.innerHTML=`<div class="db-menu-group"><button class="drawerAction" onclick="DB.toggleDark()">☾ Alternar modo escuro · ${document.body.classList.contains('db-dark')?'ligado':'desligado'}</button><button class="drawerAction" onclick="DB.toggleAutoTheme()">◐ Modo escuro automático à noite · ${theme==='auto'?'Ativado':'Desativado'}</button><button class="drawerAction" onclick="DB.biometricInfo()">🔐 Sobre entrada por digital (indisponível)</button><button class="drawerAction" onclick="DB.allowNotifications()">🔔 Ativar notificações de vencimento e agenda</button></div><div class="db-menu-group"><button class="drawerAction" onclick="exportBackup()">↓ Exportar backup</button><button class="drawerAction" onclick="DB.shareBackup()">☁ Compartilhar backup (Drive, etc.)</button><button class="drawerAction" onclick="DB.csv()">▤ Exportar CSV (Excel)</button><button class="drawerAction" onclick="document.getElementById('importFile').click()">↑ Importar backup</button><button class="drawerAction" onclick="toggleDrawer(false);DB.importLoose()">▣ Importar lançamentos colados</button><button class="drawerAction" onclick="toggleDrawer(false);DB.undoHistory()">◷ Histórico de desfazer</button><button class="drawerAction" onclick="toggleDrawer(false);undoLast()">↶ Desfazer última ação</button></div><div class="db-menu-group"><button class="drawerAction" onclick="goTab('config')">⚙ Configurações</button><button class="drawerAction" onclick="toggleDrawer(false);lockApp()">🔒 Bloquear app</button><button class="drawerAction danger" onclick="resetAllData()">▣ Apagar todos os dados</button></div>`;if(file)foot.append(file)};
DB.toggleDark=function(){state.dbSettings.dark=document.body.classList.contains('db-dark')?'light':'dark';save();DB.theme();DB.menuActions()};
DB.toggleAutoTheme=function(){state.dbSettings.dark=state.dbSettings.dark==='auto'?'light':'auto';save();DB.theme();DB.menuActions()};
DB.biometricInfo=function(){toggleDrawer(false);openSheet('Entrada por digital','<p>O código de autenticação por digital mostrado no print não está no index.html nem no didi.js enviados. A digital não foi ativada por esta atualização.</p><p>Continue usando sua senha. Para preservar a implementação de digital anterior, envie o arquivo que contém essa função ou o código atual do repositório.</p>')};

const dbAgendaReminders=DB.currentReminders;
DB.currentReminders=function(now=new Date()){const items=dbAgendaReminders(now),today=localDateStr(now),tomorrow=localDateStr(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));for(const p of allPendingCommitments()){if(p.type==='entrada'||p.noDate||![today,tomorrow].includes(p.date))continue;items.push({key:'pay:'+(p.ref||p.desc)+':'+today,text:(p.date===today?'Vence hoje: ':'Vence amanhã: ')+p.desc+', '+DB.rawMoney(p.amount)+'.',morning:p.date===today});}return items;};

const dbOldDrawer=toggleDrawer;toggleDrawer=function(open){if(open)DB.menuActions();dbOldDrawer(open)};
DB.menuActions();

/* Device-local WebAuthn unlock. The platform owns biometrics; no biometric image is read. */
DB.bioKey='dbDeviceCredentialV1';
DB.bioRead=function(){try{const r=JSON.parse(localStorage.getItem(DB.bioKey)||'null');return r?.origin===location.origin&&r?.rpId===location.hostname?r:null}catch{return null}};
DB.bioB64=buffer=>{let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
DB.bioBytes=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
DB.bioEqual=(a,b)=>{a=new Uint8Array(a);b=new Uint8Array(b);if(a.length!==b.length)return false;let diff=0;for(let i=0;i<a.length;i++)diff|=a[i]^b[i];return diff===0};
DB.bioError=function(e){const msg={NotAllowedError:'A confirmação foi cancelada ou expirou. Tente novamente ou use a senha.',NotSupportedError:'Este navegador não oferece a autenticação necessária. Abra o app pelo Chrome atualizado.',SecurityError:'Abra o endereço HTTPS do seu app para usar a biometria.',InvalidStateError:'Já existe uma credencial cadastrada. Use a senha e reconfigure a biometria.'};return msg[e.name]||e.message||'Não foi possível validar a biometria. Use a senha.'};
DB.bioAvailable=async()=>!!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials?.create&&navigator.credentials?.get&&crypto.subtle&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
DB.bioClient=function(bytes,challenge,type){const data=JSON.parse(new TextDecoder().decode(bytes));if(data.type!==type||data.challenge!==DB.bioB64(challenge)||data.origin!==location.origin||data.crossOrigin===true)throw Error('Resposta de autenticação inválida. Use a senha.');};
DB.bioAuth=async function(bytes,rp){const data=new Uint8Array(bytes);const hash=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(rp)));if(data.length<37||!DB.bioEqual(data.slice(0,32),hash)||(data[32]&5)!==5)throw Error('Não houve confirmação da identidade no aparelho. Use a senha.');return new DataView(data.buffer,data.byteOffset,data.byteLength).getUint32(33,false)};
DB.bioECDSA=function(signature){const b=new Uint8Array(signature);let p=0;const len=()=>{let n=b[p++];if(n&128){const count=n&127;if(count>2)throw Error('Assinatura inválida');n=0;for(let i=0;i<count;i++)n=(n<<8)|b[p++]}return n};if(b[p++]!==48)throw Error('Assinatura inválida');const total=len();if(p+total!==b.length)throw Error('Assinatura inválida');const out=new Uint8Array(64);for(let i=0;i<2;i++){if(b[p++]!==2)throw Error('Assinatura inválida');let n=len();if(n<1||p+n>b.length)throw Error('Assinatura inválida');let v=b.slice(p,p+n);p+=n;while(v.length>32&&v[0]===0)v=v.slice(1);if(v.length>32)throw Error('Assinatura inválida');out.set(v,i*32+32-v.length)}if(p!==b.length)throw Error('Assinatura inválida');return out};
DB.bioValidate=async function(credential,record,challenge){if(!credential||credential.type!=='public-key'||!DB.bioEqual(credential.rawId,DB.bioBytes(record.id)))throw Error('A credencial não corresponde a este app.');const r=credential.response;DB.bioClient(r.clientDataJSON,challenge,'webauthn.get');const count=await DB.bioAuth(r.authenticatorData,record.rpId);const hash=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON));const auth=new Uint8Array(r.authenticatorData);const signed=new Uint8Array(auth.length+hash.length);signed.set(auth);signed.set(hash,auth.length);const alg=record.alg===-7?{name:'ECDSA',namedCurve:'P-256'}:record.alg===-257?{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'}:null;if(!alg)throw Error('Algoritmo de autenticação incompatível');const key=await crypto.subtle.importKey('spki',DB.bioBytes(record.publicKey),alg,false,['verify']);const signature=record.alg===-7?DB.bioECDSA(r.signature):r.signature;const params=record.alg===-7?{name:'ECDSA',hash:'SHA-256'}:{name:'RSASSA-PKCS1-v1_5'};if(!await crypto.subtle.verify(params,key,signature,signed))throw Error('Assinatura não reconhecida. Use a senha.');return count};
DB.bioUI=function(){const record=DB.bioRead();let b=document.getElementById('db-bio-unlock');if(!b){b=document.createElement('button');b.id='db-bio-unlock';b.type='button';b.className='btn gold block';b.style.marginTop='12px';b.onclick=DB.bioUnlock;document.querySelector('.lockCard').append(b)}b.hidden=!record;b.style.display=record?'flex':'none';b.textContent='Entrar com digital / biometria';document.querySelectorAll('[data-db-bio]').forEach(el=>el.textContent=record?'🔐 Desativar entrada por digital / biometria':'🔐 Ativar entrada por digital / biometria');};
DB.bioConfigure=async function(){if(document.getElementById('app').style.display==='none')return;toggleDrawer(false);const existing=DB.bioRead();if(existing){if(!confirm('Desativar entrada por biometria neste navegador? A senha continuará funcionando.'))return;localStorage.removeItem(DB.bioKey);DB.bioUI();return toast('Entrada por biometria desativada')}openSheet('Ativar entrada por digital / biometria','<p>O Android confirmará sua identidade usando digital, rosto ou PIN. O app não recebe nem armazena sua impressão digital.</p><p>O cadastro vale para este endereço e navegador. A senha continua disponível.</p><button class="btn block" id="db-bio-enroll" onclick="DB.bioEnroll()">Cadastrar no aparelho</button><p id="db-bio-result" role="status" class="muted"></p>');};
DB.bioEnroll=async function(){const button=document.getElementById('db-bio-enroll'),status=document.getElementById('db-bio-result');if(DB.bioBusy)return;DB.bioBusy=true;button.disabled=true;try{if(!await DB.bioAvailable())throw Error('Biometria indisponível. Use o Chrome em HTTPS e configure a segurança de tela no Android.');const challenge=crypto.getRandomValues(new Uint8Array(32)),rpId=location.hostname;const credential=await navigator.credentials.create({publicKey:{challenge,rp:{name:'DB · Meu assistente',id:rpId},user:{id:crypto.getRandomValues(new Uint8Array(32)),name:'DB',displayName:'Jhony · DB'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},attestation:'none',timeout:60000}});if(!credential)throw Error('Cadastro cancelado.');DB.bioClient(credential.response.clientDataJSON,challenge,'webauthn.create');if(!credential.response.getPublicKey||!credential.response.getAuthenticatorData)throw Error('Atualize o Chrome para cadastrar esta credencial.');await DB.bioAuth(credential.response.getAuthenticatorData(),rpId);const spki=credential.response.getPublicKey(),alg=credential.response.getPublicKeyAlgorithm();if(!spki||![-7,-257].includes(alg))throw Error('Tipo de chave não compatível.');const record={id:DB.bioB64(credential.rawId),publicKey:DB.bioB64(spki),alg,rpId,origin:location.origin,createdAt:new Date().toISOString()};status.textContent='Cadastro criado. Confirme mais uma vez para testar o desbloqueio.';const check=crypto.getRandomValues(new Uint8Array(32));const proof=await navigator.credentials.get({publicKey:{challenge:check,rpId,allowCredentials:[{type:'public-key',id:credential.rawId}],userVerification:'required',timeout:60000}});await DB.bioValidate(proof,record,check);localStorage.setItem(DB.bioKey,JSON.stringify(record));DB.bioUI();closeSheet();toast('Biometria ativada e validada neste aparelho.')}catch(e){status.textContent=DB.bioError(e)}finally{DB.bioBusy=false;button.disabled=false;}};
DB.bioUnlock=async function(){if(DB.bioBusy||document.getElementById('lockScreen').style.display==='none')return;const record=DB.bioRead();if(!record)return;DB.bioBusy=true;const b=document.getElementById('db-bio-unlock');b.disabled=true;const err=document.getElementById('lockErr');err.textContent='Confirme no seu aparelho…';try{if(!await DB.bioAvailable())throw Error('Use a senha. A biometria não está disponível neste navegador.');const challenge=crypto.getRandomValues(new Uint8Array(32));const credential=await navigator.credentials.get({publicKey:{challenge,rpId:record.rpId,allowCredentials:[{type:'public-key',id:DB.bioBytes(record.id)}],userVerification:'required',timeout:60000}});await DB.bioValidate(credential,record,challenge);document.getElementById('lockInput').value='';err.textContent='';document.getElementById('lockScreen').style.display='none';document.getElementById('app').style.display='flex';runAuto();render();DB.checkReminders(true)}catch(e){err.textContent=DB.bioError(e)}finally{DB.bioBusy=false;b.disabled=false;}};
DB.biometricInfo=DB.bioConfigure;
const bioOldMenu=DB.menuActions;DB.menuActions=function(){bioOldMenu();const b=document.querySelector('.drawerAction[onclick="DB.biometricInfo()"]');if(b)b.setAttribute('data-db-bio','');DB.bioUI()};
const bioOldSettings=DB.settings;DB.settings=function(){return bioOldSettings()+`<div class="card"><h3>Digital / biometria</h3><p>${DB.bioRead()?'Ativada neste navegador.':'Ainda não configurada neste navegador.'}</p><button class="btn" onclick="DB.bioConfigure()">${DB.bioRead()?'Desativar':'Ativar'} biometria</button></div>`};
DB.bioUI();DB.menuActions();

</script>
