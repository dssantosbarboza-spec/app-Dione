<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Baixar aplicativo Didi original</title><style>body{font:16px system-ui;background:#f3f1ea;color:#143e3c;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{background:white;border-radius:16px;padding:28px;max-width:480px;box-shadow:0 8px 24px #0001}button{border:0;background:#0f3d3e;color:white;border-radius:9px;padding:13px 20px;font-size:17px;cursor:pointer}p{line-height:1.5}small{color:#596b66}</style></head><body><main><h2>Recuperar o aplicativo Didi</h2><p>Este botão baixa o <b>index.html original da Didi</b>, anterior à substituição acidental pelo atualizador.</p><button id="baixar">Baixar index.html</button><p id="status" role="status"></p><small>Este arquivo não instala nada e não altera seus dados. É necessário publicar o index.html baixado no GitHub.</small></main><script>
const url='https://raw.githubusercontent.com/dssantosbarboza-spec/app-Dione/bdb92633d9f054f7de9429b2b1a66aa65d76a7ae/index.html';
document.getElementById('baixar').addEventListener('click',async()=>{const status=document.getElementById('status');status.textContent='Buscando a versão original...';try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const contents=await r.text();if(!contents.includes('<!DOCTYPE html>')||!contents.includes('App Pessoal Dione')||contents.length<100000)throw Error('Arquivo inesperado');const blob=new Blob([contents],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);status.textContent='Download iniciado. O arquivo chama-se index.html.'}catch(err){status.textContent='Não foi possível baixar automaticamente ('+err.message+'). Verifique a conexão com a internet e tente novamente.'}});
</script></body></html>
