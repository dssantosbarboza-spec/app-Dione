<style>
:root{
  --bg:#F3F1EA; --panel:#FFFFFF; --ink:#132C2A; --ink-soft:#5B6C69;
  --teal:#0F3D3E; --teal-dark:#0A2B2C; --gold:#C9973A; --gold-soft:#EFE1C4;
  --green:#2E7D5B; --green-soft:#E4F1EA; --red:#B23A2E; --red-soft:#F8E4E1;
  --line:#E4E0D3; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;}
h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* LOCK SCREEN */
#lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--teal) 0%,var(--teal-dark) 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;}
.lockCard{background:var(--panel);border-radius:20px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.lockLogo{width:64px;height:64px;border-radius:16px;background:var(--teal);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 16px;}
.lockCard h1{font-size:20px;margin:0 0 4px;}
.lockCard p{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.lockCard input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:22px;text-align:center;letter-spacing:6px;margin-bottom:12px;}
.lockCard button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--teal);color:#fff;font-weight:600;font-size:15px;}
.lockErr{color:var(--red);font-size:12px;height:16px;margin-bottom:4px;}
.lockHint{margin-top:14px;font-size:11px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}

/* APP SHELL */
#app{display:none;height:100%;flex-direction:column;}
header.top{background:var(--teal);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
header.top .menuBtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
header.top .title{flex:1;}
header.top .title b{font-size:15px;display:block;}
header.top .title span{font-size:11px;opacity:.75;}
header.top .lockBtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:16px;}

#drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--teal-dark);color:#fff;z-index:200;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding-bottom:20px;}
#drawer.open{transform:translateX(0);}
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;}
#drawerOverlay.show{display:block;}
.drawerHead{padding:20px 18px 12px;border-bottom:1px solid rgba(255,255,255,.1);}
.drawerHead b{font-size:15px;}
.navItem{display:flex;align-items:center;gap:10px;padding:13px 18px;font-size:14px;color:rgba(255,255,255,.85);border-left:3px solid transparent;}
.navItem.active{background:rgba(255,255,255,.08);border-left-color:var(--gold);color:#fff;font-weight:600;}
.navItem .ic{width:20px;text-align:center;}
.drawerFoot{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding:14px 18px 4px;display:flex;flex-direction:column;gap:8px;}
.drawerAction{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;text-align:left;}

main{flex:1;overflow-y:auto;padding:14px 14px 80px;}
.card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.card h3{margin:0 0 10px;font-size:14px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.row:last-child{border-bottom:none;}
.big{font-size:26px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-soft);color:var(--green);}
.pill.red{background:var(--red-soft);color:var(--red);}
.expenseRow{border-bottom:1px solid var(--line);padding:12px 0;}
.expenseRow:last-child{border-bottom:none;}
.expenseTop{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;margin-bottom:6px;}
.expenseMeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.expenseActions{display:flex;gap:8px;flex-wrap:wrap;}
.pill.gold{background:var(--gold-soft);color:#8a6412;}
.pill.grey{background:#EEE;color:#777;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:11px;border:none;background:var(--teal);color:#fff;font-weight:600;font-size:13.5px;}
.btn.gold{background:var(--gold);color:#3a2b06;}
.btn.outline{background:transparent;border:1.4px solid var(--teal);color:var(--teal);}
.btn.small{padding:7px 10px;font-size:12.5px;}
.btn.danger{background:var(--red);}
.btn.block{width:100%;}
.fab{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#3a2b06;border:none;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:60;}
label.f{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;font-weight:600;}
input.f,select.f,textarea.f{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;}
.formSheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.formSheet.show{display:flex;}
.sheetBody{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 18px 24px;}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sheetHead h3{margin:0;font-size:16px;}
.sheetHead .x{background:none;border:none;font-size:20px;color:var(--ink-soft);}
.muted{color:var(--ink-soft);font-size:12.5px;}
.emptyState{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabs button{flex:none;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.gaugeWrap{margin-top:6px;}
.gaugeTrack{height:14px;background:#EDEAE0;border-radius:10px;overflow:hidden;position:relative;}
.gaugeFill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--green),#7fc7a5);}
.miniBox{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.miniBox:last-child{border-bottom:none;}
.progressBar{height:8px;background:#EDEAE0;border-radius:6px;overflow:hidden;margin-top:6px;}
.progressFill{height:100%;background:var(--gold);}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calGrid .dh{font-size:10px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
.calDay{aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.calDay.today{border-color:var(--gold);border-width:2px;}
.calDay .dots{display:flex;gap:2px;position:absolute;bottom:4px;}
.dot{width:5px;height:5px;border-radius:50%;}
.dot.inc{background:var(--green);} .dot.exp{background:var(--red);} .dot.card{background:var(--gold);}
.linkline{background:none;border:none;color:var(--teal);font-size:13px;font-weight:600;text-decoration:underline;padding:6px 0;}
.alertItem{display:flex;gap:10px;padding:12px;border-radius:12px;margin-bottom:8px;}
.alertItem.warn{background:var(--gold-soft);} .alertItem.danger{background:var(--red-soft);} .alertItem.info{background:var(--green-soft);}
.alertItem .ic{font-size:18px;}
.alertItem .txt b{display:block;font-size:13.5px;} .alertItem .txt span{font-size:12px;color:var(--ink-soft);}
canvas{width:100%;display:block;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s;}
.toast.show{opacity:1;}
.searchBar{display:flex;gap:8px;margin-bottom:10px;}
.searchBar input{flex:1;}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}
</style>

<body>

<div id="lockScreen">
  <div class="lockCard">
    <div class="lockLogo">D</div>
    <h1 id="lockTitle">App Pessoal Dione</h1>
    <p id="lockSub">Digite sua senha para entrar</p>
    <div class="lockErr" id="lockErr"></div>
    <input type="password" id="lockInput" inputmode="numeric" maxlength="12" placeholder="••••">
    <button class="btn block" onclick="tryUnlock()" style="background:var(--teal)">Entrar</button>
    <div class="lockHint" id="lockHint" onclick="forgotPw()">Esqueci a senha (redefinir localmente)</div>
  </div>
</div>

<div id="app">
  <header class="top">
    <button class="menuBtn" onclick="toggleDrawer(true)">☰</button>
    <div class="title"><b>App Pessoal Dione</b><span id="headerSub">Minha situação</span></div>
    <button class="lockBtn" onclick="lockApp()">🔒</button>
  </header>

  <div id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <nav id="drawer">
    <div class="drawerHead"><b>Menu</b></div>
    <div id="navList"></div>
    <div class="drawerFoot">
      <button class="drawerAction" onclick="exportBackup()">⬇️ Exportar backup</button>
      <button class="drawerAction" onclick="document.getElementById('importFile').click()">⬆️ Importar backup</button>
      <button class="drawerAction" onclick="resetAllData()" style="color:#ffb3a7">🗑️ Apagar todos os dados</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
    </div>
  </nav>

  <main id="content"></main>
  <button class="fab" id="fabBtn" onclick="fabAction()">+</button>
</div>

<div class="formSheet" id="sheet">
  <div class="sheetBody" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="backup-data.js"></script>
<script>

/* ================= DATA MODEL ================= */
const CATS_IN = ["Salário","Aluguel","Vale","Freelance","Reembolso","Vendas","Outras entradas"];
const CATS_OUT = ["Moradia","Condomínio","Água","Luz","Gás","Internet","Telefone","Alimentação","Supermercado","Transporte","Combustível","Saúde","Farmácia","Educação","Vestuário","Lazer","Assinaturas/Streaming","Cartão","Cigarros","Jogos/Loterias","Pets","Presentes","Impostos/Taxas","Manutenção","Beleza/Cuidados pessoais","Empréstimo","Dívidas","Caixinha","Outras despesas"];

const DEFAULT_STATE = () => ({
  password: "1234",
  saldo: 0,
  pendingSalaryDeduction: 0,
  categoriesIn: CATS_IN.slice(),
  categoriesOut: CATS_OUT.slice(),
  lancamentos: [], // {id,desc,category,amount,type:'entrada'|'saida',date,purchaseDate,status,installments,installmentNum,groupId,cardId,receipt,trashed,applied}
  cards: [
    {id:"card_main", name:"Cartão de Crédito Nubank Dione", limit:350, dueDay:12, bestDay:5, closingDay:null, invoices:[]},
    {id:"card_shopee", name:"Shopee", limit:500, dueDay:6, bestDay:27, closingDay:26, invoices:[]},
  ],
  loan: {id:"loan1", total:1000, installmentsCount:12, installmentValue:150, dueDay:8, nextDate:"2026-09-08", paidCount:0},
  debts: [],
  boxes: [
    {id:"box_vitoria", name:"Vitória", goal:5000, balance:20, monthlyPlan:0, contributions:[]},
  ],
  movements: [],
  history: [],
  trash: [],
  closings: [],
  undoSnapshots: [],
});

let state = load();
if(state.pendingSalaryDeduction===undefined) state.pendingSalaryDeduction = 0;
function load(){
  try{ const raw = localStorage.getItem("dioneData2"); if(raw) return JSON.parse(raw); }catch(e){}
  try{ if(window.__DIONE_BACKUP__){ const base=DEFAULT_STATE(); const restored=Object.assign(base, window.__DIONE_BACKUP__); if(!restored.password) restored.password=base.password; localStorage.setItem("dioneData2", JSON.stringify(restored)); return restored; } }catch(e){}
  return DEFAULT_STATE();
}
function save(){ localStorage.setItem("dioneData2", JSON.stringify(state)); }
function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function localDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
function todayStr(){ return localDateStr(new Date()); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function addMonthsIso(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setMonth(d.getMonth()+n); return localDateStr(d); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function logHist(text){ state.history.unshift({id:uid('h'), ts:new Date().toISOString(), text}); if(state.history.length>500) state.history.pop(); }
function pushMovement(type, desc, amount){ state.movements.unshift({id:uid('mov'), ts:new Date().toISOString(), type, desc, amount}); if(state.movements.length>400) state.movements.pop(); }
function snapshot(){ state.undoSnapshots.push(JSON.stringify({saldo:state.saldo,lancamentos:state.lancamentos,cards:state.cards,loan:state.loan,debts:state.debts,boxes:state.boxes,movements:state.movements})); if(state.undoSnapshots.length>20) state.undoSnapshots.shift(); }
function undoLast(){
  if(!state.undoSnapshots.length){ toast("Nada para desfazer"); return; }
  const s = JSON.parse(state.undoSnapshots.pop());
  Object.assign(state, s);
  save(); logHist("Última ação desfeita"); render(); toast("Última ação desfeita");
}
["Cigarros","Farmácia"].forEach(()=>{}); // no-op placeholder to keep structure stable

/* ================= LOCK ================= */
function tryUnlock(){
  const val = document.getElementById('lockInput').value;
  if(val === state.password){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    runAuto();
    render();
  } else {
    document.getElementById('lockErr').textContent = "Senha incorreta";
  }
}
function lockApp(){
  document.getElementById('lockInput').value='';
  document.getElementById('lockErr').textContent='';
  document.getElementById('app').style.display='none';
  document.getElementById('lockScreen').style.display='flex';
}
function forgotPw(){
  const np = prompt("Redefinir localmente. Digite a nova senha:");
  if(np){ state.password = np; save(); toast("Senha redefinida"); }
}
document.getElementById('lockInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

/* ================= NAV ================= */
const NAV = [
  {id:"situacao", label:"Início", ic:"🏠"},
  {id:"lancamentos", label:"Entradas e Saídas", ic:"🔄"},
  {id:"cartoes", label:"Cartões", ic:"💳"},
  {id:"emprestimo", label:"Empréstimo e Dívidas", ic:"📉"},
  {id:"caixinhas", label:"Caixinhas", ic:"🐷"},
  {id:"previsao", label:"Previsão de pagamentos", ic:"🧮"},
  {id:"projecao", label:"Projeção do próximo mês", ic:"🔮"},
  {id:"historico", label:"Histórico", ic:"🕘"},
  {id:"calendario", label:"Calendário", ic:"📅"},
  {id:"relatorios", label:"Relatórios", ic:"📊"},
  {id:"fechamento", label:"Fechamento mensal", ic:"📁"},
];
function buildNav(){
  document.getElementById('navList').innerHTML = NAV.map(n=>
    `<div class="navItem ${n.id===currentTab?'active':''}" onclick="goTab('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</div>`
  ).join("");
}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', open);
  document.getElementById('drawerOverlay').classList.toggle('show', open);
}
function goTab(id){ currentTab=id; toggleDrawer(false); closeSheet(); document.getElementById('didiPanel')?.classList.remove('open'); if(window.DB)DB.stopVoice?.(); render(); const content=document.getElementById('content'); if(content)content.scrollTop=0; }

/* ================= HELPERS ================= */
function cardById(id){ return state.cards.find(c=>c.id===id); }
function boxById(id){ return state.boxes.find(b=>b.id===id); }
function activeLanc(){ return state.lancamentos.filter(l=>!l.trashed); }
function pendingLanc(){ return activeLanc().filter(l=>!l.applied); }

function computeCardDueDate(purchaseDateStr, card){
  if(!card || !card.closingDay || !card.dueDay) return purchaseDateStr;
  const d = new Date(purchaseDateStr+"T00:00:00");
  let closingMonth = d.getMonth(), closingYear = d.getFullYear();
  if(d.getDate() >= card.closingDay){ closingMonth += 1; if(closingMonth>11){ closingMonth=0; closingYear+=1; } }
  let dueMonth = closingMonth, dueYear = closingYear;
  if(card.dueDay <= card.closingDay){ dueMonth += 1; if(dueMonth>11){ dueMonth=0; dueYear+=1; } }
  const lastDay = daysInMonth(dueYear, dueMonth);
  const effDay = Math.min(card.dueDay, lastDay);
  return localDateStr(new Date(dueYear, dueMonth, effDay));
}

function applyLancEffect(l){
  if(l.type==='entrada'){
    if(l.category==='Vale'){
      state.saldo += Number(l.amount||0);
      state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction||0) + Number(l.amount||0);
      pushMovement('credito', `${l.category}: ${l.desc}`, l.amount);
    } else if(l.category==='Salário'){
      let amt = Number(l.amount||0);
      let consumed = 0;
      if(Number(state.pendingSalaryDeduction||0) > 0){
        consumed = Math.min(amt, Number(state.pendingSalaryDeduction));
        amt -= consumed;
        state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction) - consumed;
      }
      l._consumedVale = consumed;
      l._creditedAmount = amt;
      state.saldo += amt;
      pushMovement('credito', `${l.category}: ${l.desc}${consumed>0?` (descontado ${fmt(consumed)} de vale)`:''}`, amt);
    } else {
      state.saldo += Number(l.amount||0);
      pushMovement('credito', `${l.category}: ${l.desc}`, l.amount);
    }
  } else {
    state.saldo -= Number(l.amount||0);
    pushMovement('debito', `${l.category}: ${l.desc}`, l.amount);
  }
  l.applied = true;
  l.status = 'realizado';
}
function unapplyLancEffect(l){
  if(l.type==='entrada'){
    if(l.category==='Vale'){
      state.saldo -= Number(l.amount||0);
      state.pendingSalaryDeduction = Math.max(0, Number(state.pendingSalaryDeduction||0) - Number(l.amount||0));
      pushMovement('debito', `Estorno: ${l.desc}`, l.amount);
    } else if(l.category==='Salário'){
      const credited = l._creditedAmount!=null ? l._creditedAmount : Number(l.amount||0);
      state.saldo -= credited;
      if(l._consumedVale){ state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction||0) + Number(l._consumedVale); }
      pushMovement('debito', `Estorno: ${l.desc}`, credited);
      l._consumedVale = 0; l._creditedAmount = null;
    } else {
      state.saldo -= Number(l.amount||0);
      pushMovement('debito', `Estorno: ${l.desc}`, l.amount);
    }
  } else {
    state.saldo += Number(l.amount||0);
    pushMovement('credito', `Estorno: ${l.desc}`, l.amount);
  }
  l.applied = false;
}
function runAutoLancamentos(){
  const today = todayStr();
  let changed = false;
  activeLanc().forEach(l=>{
    if(!l.applied && l.date && l.date<=today){
      applyLancEffect(l);
      logHist(`${l.type==='entrada'?'Entrada':'Saída'} vencida aplicada: ${l.desc} (${fmt(l.amount)})`);
      changed = true;
    }
  });
  if(changed) save();
}
function runAutoDebts(){
  const today = todayStr();
  let changed = false;
  state.debts.forEach(d=>{
    if(!d.paid && d.dueDate && d.dueDate<=today){
      state.saldo -= Number(d.amount||0);
      d.paid = true;
      const lc = {id:uid('lc'),type:'saida',desc:`Dívida: ${d.desc}`,category:'Dívidas',amount:Number(d.amount||0),date:d.dueDate,purchaseDate:d.dueDate,status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true};
      state.lancamentos.push(lc);
      d._lancId = lc.id;
      logHist(`Dívida vencida abatida automaticamente: ${d.desc} (${fmt(d.amount)})`);
      pushMovement('debito', `Dívida: ${d.desc}`, d.amount);
      changed = true;
    }
  });
  if(changed) save();
}
function runAuto(){ runAutoLancamentos(); runAutoDebts(); }

function monthlyPendingSaidas(ym){
  let total = pendingLanc().filter(l=>l.type==='saida' && l.date && l.date.slice(0,7)===ym).reduce((s,l)=>s+Number(l.amount||0),0);
  if(state.loan.paidCount < state.loan.installmentsCount && state.loan.nextDate && state.loan.nextDate.slice(0,7)===ym){
    total += Number(state.loan.installmentValue||0);
  }
  state.debts.filter(d=>!d.paid && d.dueDate && d.dueDate.slice(0,7)===ym).forEach(d=> total += Number(d.amount||0));
  return total;
}
function monthlyPendingEntradas(ym){
  return pendingLanc().filter(l=>l.type==='entrada' && l.date && l.date.slice(0,7)===ym).reduce((s,l)=>s+Number(l.amount||0),0);
}
function quantoPodeGastar(){
  const ym = todayStr().slice(0,7);
  return state.saldo - monthlyPendingSaidas(ym);
}
function caixinhasTotal(){ return state.boxes.reduce((s,b)=>s+Number(b.balance||0),0); }
function dividasTotal(){ return state.debts.filter(d=>!d.paid).reduce((s,d)=>s+Number(d.amount||0),0); }
function loanRemaining(){ const l=state.loan; return Math.max(0,(l.installmentsCount-l.paidCount))*l.installmentValue; }
function patrimonioTotal(){ return state.saldo + caixinhasTotal() - dividasTotal() - loanRemaining(); }
function totalMesPorTipo(ym, tipo){
  return activeLanc().filter(l=>l.applied && l.type===tipo && l.date && l.date.slice(0,7)===ym)
    .reduce((s,l)=> s + (tipo==='entrada' && l._creditedAmount!=null ? Number(l._creditedAmount) : Number(l.amount||0)), 0);
}

function allPendingCommitments(){
  const list = [];
  pendingLanc().forEach(l=> list.push({date:l.date, desc:l.desc, amount:Number(l.amount||0), type:l.type==='entrada'?'entrada':'despesa', ref:l.id}));
  if(state.loan.paidCount < state.loan.installmentsCount){
    let d = state.loan.nextDate;
    for(let i=state.loan.paidCount; i<state.loan.installmentsCount; i++){
      list.push({date:d, desc:'Parcela do empréstimo', amount:Number(state.loan.installmentValue||0), type:'emprestimo'});
      d = addMonthsIso(d,1);
    }
  }
  state.debts.filter(d=>!d.paid).forEach(d=> list.push({date:d.dueDate||todayStr(), desc:`Dívida: ${d.desc}`, amount:Number(d.amount||0), type:'divida', noDate:!d.dueDate}));
  state.cards.forEach(c=>{
    (c.invoices||[]).forEach(inv=>{
      const restante = Math.max(0, inv.amount - inv.paidAmount);
      if(restante > 0.009){
        const [yy,mm] = inv.month.split('-').map(Number);
        const lastDay = daysInMonth(yy, mm-1);
        const effDay = Math.min(c.dueDay||1, lastDay);
        list.push({date:`${inv.month}-${String(effDay).padStart(2,'0')}`, desc:`Fatura ${c.name} (${inv.month})`, amount:restante, type:'fatura'});
      }
    });
  });
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

function monthlyNetEstimate(){
  const realizadas = activeLanc().filter(l=>l.applied);
  const months = new Set(realizadas.map(l=>l.date.slice(0,7)));
  const nMonths = Math.max(1, months.size);
  const entradasMedia = realizadas.filter(l=>l.type==='entrada').reduce((s,l)=>s+Number(l.amount||0),0) / nMonths;
  const saidasMedia = realizadas.filter(l=>l.type==='saida').reduce((s,l)=>s+Number(l.amount||0),0) / nMonths;
  const loanM = state.loan.paidCount<state.loan.installmentsCount? state.loan.installmentValue:0;
  const boxesM = state.boxes.reduce((s,b)=>s+Number(b.monthlyPlan||0),0);
  return entradasMedia - saidasMedia - loanM - boxesM;
}

/* ================= RENDER ROOT ================= */
function render(){
  runAuto();
  buildNav();
  document.getElementById('headerSub').textContent = NAV.find(n=>n.id===currentTab).label;
  const c = document.getElementById('content');
  const renderers = {
    situacao: renderSituacao, lancamentos: renderLancamentos, cartoes: renderCartoes,
    emprestimo: renderEmprestimo, caixinhas: renderCaixinhas, previsao: renderPrevisao,
    projecao: renderProjecao, historico: renderHistorico, calendario: renderCalendario,
    relatorios: renderRelatorios, fechamento: renderFechamento,
  };
  c.innerHTML = renderers[currentTab]();
  const fab = document.getElementById('fabBtn');
  fab.style.display = ['lancamentos','caixinhas'].includes(currentTab) ? 'flex':'none';
  if(currentTab==='calendario') drawCalendar();
  if(currentTab==='situacao') drawProjectionChart('chartSituacao', 12);
}
function fabAction(){
  if(currentTab==='lancamentos') openLancForm();
  else if(currentTab==='caixinhas') openBoxForm();
}

/* ================= SITUAÇÃO ================= */
function renderSituacao(){
  const saldo = state.saldo;
  const podeGastar = quantoPodeGastar();
  const pct = saldo>0 ? Math.max(0,Math.min(100, (podeGastar/saldo)*100)) : 0;
  const ym = todayStr().slice(0,7);
  const recebidoMes = totalMesPorTipo(ym,'entrada');
  const pagoMes = totalMesPorTipo(ym,'saida');
  const compromissos = allPendingCommitments().filter(c=>{
    const diff = Math.round((new Date(c.date+"T00:00:00") - new Date(todayStr()+"T00:00:00"))/86400000);
    return diff>=0 && diff<=30 && !['emprestimo','divida'].includes(c.type) && !/caixinha|empréstimo|emprestimo|dívida|divida/i.test(c.desc);
  }).slice(0,6);
  return `<div class="db-home">
  <div class="db-home-welcome"><div><div class="db-home-kicker">SEU ESPAÇO PESSOAL</div><h2>Olá, DB.</h2><p>Tudo o que importa, em um só lugar.</p></div><button class="db-home-robot" onclick="DB.openVoice(true)" aria-label="Fale com a DIdI">🤖</button></div>
  <div class="card db-home-balance">
    <h3>Saldo disponível <span>✦</span></h3>
    <div class="big db-home-value">${fmt(saldo)}</div>
    <div class="muted">${DB.monthLabel(ym)}</div>
  </div>
  <div class="grid2 db-home-totals">
    <div class="card"><h3>↙ Entradas do mês</h3><div class="big" style="font-size:19px;color:var(--green)">${fmt(recebidoMes)}</div></div>
    <div class="card"><h3>↗ Saídas do mês</h3><div class="big" style="font-size:19px;color:var(--red)">${fmt(pagoMes)}</div></div>

function drawProjectionChart(canvasId, months){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.parentElement.clientWidth; canvas.width = w; canvas.height=140;
  ctx.clearRect(0,0,w,140);
  const net = monthlyNetEstimate();
  const base = state.saldo;
  const pts = [];
  for(let i=0;i<=months;i++) pts.push(base + net*i);
  const min = Math.min(...pts,0), max = Math.max(...pts,1);
  const pad = 20;
  const xstep = (w-pad*2)/months;
  ctx.strokeStyle = '#0F3D3E'; ctx.lineWidth=2.5; ctx.beginPath();
  pts.forEach((v,i)=>{
    const x = pad+i*xstep;
    const y = 120 - ((v-min)/(max-min||1))*100;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  [6,9,12].forEach(m=>{
    if(m>months) return;
    const x = pad+m*xstep; const y = 120-((pts[m]-min)/(max-min||1))*100;
    ctx.fillStyle='#C9973A'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    ctx.fillStyle='#132C2A'; ctx.font='11px Inter'; ctx.textAlign='center';
    ctx.fillText(m+'m: '+fmt(pts[m]).replace('R$',''), x, y-10);
  });
  ctx.strokeStyle='#E4E0D3'; ctx.beginPath(); ctx.moveTo(pad,120); ctx.lineTo(w-pad,120); ctx.stroke();
}

function saveLanc(id){
  const type = document.getElementById('f_type_es').value;
  const desc = document.getElementById('f_desc').value.trim();
  const category = document.getElementById('f_cat').value;
  const amount = parseFloat(document.getElementById('f_amount').value)||0;
  const date = document.getElementById('f_date').value;
  const status = document.getElementById('f_status').value;
  const ptypeEl = document.getElementById('f_ptype');
  const cardEl = document.getElementById('f_card');
  const cardId = (type==='saida' && cardEl && cardEl.value) ? cardEl.value : null;
  const installments = (type==='saida' && ptypeEl && ptypeEl.value==='parcelado') ? Math.max(2, parseInt(document.getElementById('f_installments').value,10)||2) : 1;
  if(!desc || amount<=0 || !date){ toast("Preencha descrição, valor e data"); return; }
  const card = cardId ? cardById(cardId) : null;
  const hasCycle = card && card.closingDay && card.dueDay;
  const firstDueDate = hasCycle ? computeCardDueDate(date, card) : date;
  const fileInput = document.getElementById('f_receipt');
  const finish = (receiptData)=>{
    snapshot();
    if(id){
      const l = state.lancamentos.find(x=>x.id===id);
      if(l.applied){ unapplyLancEffect(l); }
      Object.assign(l,{type,desc,category,amount,date:firstDueDate,purchaseDate:date,status,cardId,applied:false});
      if(receiptData) l.receipt = receiptData;
      if(status==='realizado'){ applyLancEffect(l); }
      logHist(`Lançamento editado: ${desc}`);
    } else if(installments>1){
      const groupId = uid('grp');
      const per = Math.round((amount/installments)*100)/100;
      let firstRecord = null;
      for(let n=1;n<=installments;n++){
        const dDate = n===1 ? firstDueDate : addMonthsIso(firstDueDate, n-1);
        let stat = n===1 ? status : 'previsto';
        if(n===1 && dDate <= todayStr()) stat = 'realizado';
        const rec = {id:uid('lc'),type,desc,category,amount:per,date:dDate,purchaseDate:date,status:stat,installments,installmentNum:n,groupId,cardId,receipt:n===1?receiptData:null,trashed:false,applied:false};
        state.lancamentos.push(rec);
        if(n===1) firstRecord = rec;
      }
      if(firstRecord && firstRecord.status==='realizado'){ applyLancEffect(firstRecord); }
      logHist(`Saída parcelada criada: ${desc} (${installments}x)`);
    } else {
      const rec = {id:uid('lc'),type,desc,category,amount,date:firstDueDate,purchaseDate:date,status,installments:1,installmentNum:1,groupId:null,cardId,receipt:receiptData,trashed:false,applied:false};
      state.lancamentos.push(rec);
      if(status==='realizado'){ applyLancEffect(rec); }
      logHist(`${type==='entrada'?'Entrada':'Saída'} criada: ${desc}`);
    }
    save();
    runAuto();
    closeSheet(); render(); toast("Salvo");
  };
  if(fileInput && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=> finish(reader.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else finish(null);
}
function deleteLanc(id){
  snapshot();
  const l = state.lancamentos.find(x=>x.id===id);
  if(l.applied) unapplyLancEffect(l);
  l.trashed = true; l.applied = false;
  state.trash.push({...l, deletedAt:new Date().toISOString()});
  logHist(`Lançamento movido para lixeira: ${l.desc}`);
  save(); closeSheet(); render(); toast("Movido para a lixeira");
}
function applyLancNow(id){

function unapplyLancNow(id){

}

}

function payLoanInstallment(){
  snapshot();
  state.saldo -= state.loan.installmentValue;
  state.loan.paidCount++;
  const d = new Date(state.loan.nextDate+"T00:00:00"); d.setMonth(d.getMonth()+1);
  state.loan.nextDate = localDateStr(d);
  state.lancamentos.push({id:uid('lc'),type:'saida',desc:'Parcela do empréstimo',category:'Empréstimo',amount:state.loan.installmentValue,date:todayStr(),purchaseDate:todayStr(),status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true});
  logHist(`Parcela do empréstimo paga (${fmt(state.loan.installmentValue)})`);
  pushMovement('debito', 'Parcela do empréstimo', state.loan.installmentValue);
  save(); render(); toast("Parcela marcada como paga");
}
function toggleDebtPaid(id){
  snapshot();
  const d=state.debts.find(x=>x.id===id);
  d.paid=!d.paid;
  if(d.paid){
    state.saldo -= Number(d.amount||0);
    const lc = {id:uid('lc'),type:'saida',desc:`Dívida: ${d.desc}`,category:'Dívidas',amount:Number(d.amount||0),date:todayStr(),purchaseDate:todayStr(),status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true};
    state.lancamentos.push(lc);
    d._lancId = lc.id;
    logHist(`Dívida quitada: ${d.desc}`);
    pushMovement('debito', `Dívida: ${d.desc}`, d.amount);
  } else {
    state.saldo += Number(d.amount||0);
    if(d._lancId){ const lc = state.lancamentos.find(x=>x.id===d._lancId); if(lc) lc.trashed = true; d._lancId=null; }
    logHist(`Dívida reaberta: ${d.desc}`);
    pushMovement('credito', `Estorno dívida: ${d.desc}`, d.amount);
  }
  save(); render();
}
function openDebtForm(id){
  const it = id? state.debts.find(d=>d.id===id) : {desc:'',amount:'',dueDate:''};
  openSheet(`${id?'Editar':'Nova'} dívida`, `
    <label class="f">Descrição</label><input class="f" id="f_desc" value="${it.desc}">
    <label class="f">Valor (R$)</label><input class="f" id="f_amount" type="text" inputmode="decimal" value="${it.amount}">
    <label class="f">Vencimento (opcional)</label><input class="f" id="f_date" type="date" value="${it.dueDate||''}">
    <div class="muted" style="margin-top:6px">${id && it.paid ? 'Essa dívida já está quitada — se mudar o valor, o saldo é ajustado pela diferença.' : ''}</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      ${id?`<button class="btn danger" onclick="deleteDebt('${id}')">Excluir</button>`:''}
      <button class="btn block" onclick="saveDebt('${id||''}')">Salvar</button>
    </div>`);
}
function saveDebt(id){
  const desc=document.getElementById('f_desc').value.trim();
  const amount=parseFloat(document.getElementById('f_amount').value)||0;
  const dueDate=document.getElementById('f_date').value;
  if(!desc||amount<=0){ toast("Preencha os campos"); return; }
  snapshot();
  if(id){
    const d = state.debts.find(x=>x.id===id);
    if(d.paid){
      state.saldo += Number(d.amount||0);
      state.saldo -= amount;
      if(d._lancId){
        const lc = state.lancamentos.find(x=>x.id===d._lancId);
        if(lc){ lc.amount = amount; lc.desc = `Dívida: ${desc}`; if(dueDate) lc.date = dueDate; }
      }
      pushMovement('debito', `Ajuste dívida: ${desc}`, amount - Number(d.amount||0));
    }
    d.desc = desc; d.amount = amount; d.dueDate = dueDate;
    logHist(`Dívida editada: ${desc}`);
  } else {
    state.debts.push({id:uid('debt'),desc,amount,dueDate,paid:false});
    logHist(`Dívida criada: ${desc}`);
  }
  save(); closeSheet(); render();
}
function deleteDebt(id){
  snapshot();
  const d = state.debts.find(x=>x.id===id);
  if(d.paid){
    state.saldo += Number(d.amount||0);
    if(d._lancId){ const lc = state.lancamentos.find(x=>x.id===d._lancId); if(lc) lc.trashed = true; }
    pushMovement('credito', `Estorno dívida excluída: ${d.desc}`, d.amount);
  }
  state.debts = state.debts.filter(x=>x.id!==id);
  logHist(`Dívida excluída: ${d.desc}`);
  save(); closeSheet(); render();
}

/* ================= PREVISÃO DE PAGAMENTOS ================= */
function renderPrevisao(){
  const pending = allPendingCommitments();
  const saidas = pending.filter(p=>p.type!=='entrada');
  const entradas = pending.filter(p=>p.type==='entrada');
  const totalPrevisto = saidas.reduce((s,p)=>s+p.amount,0);
  const totalEntradasPrev = entradas.reduce((s,p)=>s+p.amount,0);
  const saldo = state.saldo;
  const resultado = saldo - totalPrevisto + totalEntradasPrev;
  const byMonth = {};
  saidas.forEach(p=>{ const m=p.date.slice(0,7); byMonth[m]=(byMonth[m]||0)+p.amount; });
  const byMonthIn = {};
  entradas.forEach(p=>{ const m=p.date.slice(0,7); byMonthIn[m]=(byMonthIn[m]||0)+p.amount; });
  const months = [...new Set([...Object.keys(byMonth), ...Object.keys(byMonthIn)])].sort();
  const icon = {despesa:'🧾', emprestimo:'📉', divida:'⚠️', fatura:'💳', entrada:'💰'};
  return `<div class="card">
    <h3>Resumo geral</h3>
    <div class="row"><span>Saldo atual</span><b>${fmt(saldo)}</b></div>
    <div class="row"><span>Total previsto a pagar</span><b style="color:var(--red)">${fmt(totalPrevisto)}</b></div>
    <div class="row"><span>Total previsto a receber</span><b style="color:var(--green)">${fmt(totalEntradasPrev)}</b></div>
    <hr class="sep">
    <div class="row"><span><b>${resultado>=0?'Sobra de saldo':'Falta de saldo'}</b></span><b class="big" style="font-size:20px;color:${resultado>=0?'var(--green)':'var(--red)'}">${fmt(resultado)}</b></div>
  </div>
  <div class="card">
    <h3>Total por mês (a pagar / a receber)</h3>
    ${months.length? months.map(m=>`<div class="row"><span>${m}</span><b>${byMonthIn[m]?`<span style="color:var(--green)">+${fmt(byMonthIn[m])}</span> `:''}${byMonth[m]?`<span style="color:var(--red)">-${fmt(byMonth[m])}</span>`:''}</b></div>`).join(''):'<div class="emptyState">Nada previsto</div>'}
  </div>
  <div class="card">
    <h3>Tudo previsto (detalhado)</h3>
    ${pending.length? pending.map(p=>`<div class="row"><span>${icon[p.type]||'•'} ${p.desc}${p.noDate?' <span class="muted">(sem data)</span>':''}<br><span class="muted">${fmtDate(p.date)}</span></span>
      <span style="text-align:right"><b style="color:${p.type==='entrada'?'var(--green)':'var(--ink)'}">${p.type==='entrada'?'+':''}${fmt(p.amount)}</b>${p.type!=='entrada' && p.ref?`<br><button class="btn small outline" style="margin-top:4px" onclick="applyLancNow('${p.ref}');goTab('previsao')">Aplicar agora</button>`:(p.ref?`<br><button class="btn small outline" style="margin-top:4px" onclick="applyLancNow('${p.ref}');goTab('previsao')">Aplicar agora</button>`:'')}</span></div>`).join(''):'<div class="emptyState">Nenhum compromisso pendente 🎉</div>'}
  </div>
  <div class="card">
    <h3>Caixinhas (tudo em um lugar)</h3>
    ${state.boxes.map(b=>`<div class="row"><span>${b.name}</span><b>${fmt(b.balance)} <span class="muted">/ meta ${fmt(b.goal)}</span></b></div>`).join('')}
    <div class="row"><span><b>Total em caixinhas</b></span><b>${fmt(caixinhasTotal())}</b></div>
  </div>`;
}

/* ================= PROJEÇÃO DO PRÓXIMO MÊS ================= */
function renderProjecao(){
  const now = new Date();
  const nextD = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const ym = localDateStr(nextD).slice(0,7);
  const nomeMes = nextD.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const saidasConhecidas = monthlyPendingSaidas(ym);
  const entradasConhecidas = monthlyPendingEntradas(ym);
  const saldoPrevisto = entradasConhecidas - saidasConhecidas;
  const lancDoMes = pendingLanc().filter(l=>l.date && l.date.slice(0,7)===ym).sort((a,b)=>a.date.localeCompare(b.date));
  const loanNoMes = (state.loan.paidCount<state.loan.installmentsCount && state.loan.nextDate && state.loan.nextDate.slice(0,7)===ym);
  const dividasNoMes = state.debts.filter(d=>!d.paid && d.dueDate && d.dueDate.slice(0,7)===ym);
  return `<div class="card">
    <h3>Projeção para ${nomeMes}</h3>
    <div class="row"><span>Entradas já conhecidas</span><b style="color:var(--green)">${fmt(entradasConhecidas)}</b></div>
    <div class="row"><span>Saídas já conhecidas</span><b style="color:var(--red)">${fmt(saidasConhecidas)}</b></div>
    <hr class="sep">
    <div class="row"><span><b>Saldo previsto do mês</b></span><b class="big" style="font-size:19px;color:${saldoPrevisto>=0?'var(--green)':'var(--red)'}">${fmt(saldoPrevisto)}</b></div>
    <div class="muted" style="margin-top:6px">Baseado só no que já está lançado pra esse mês. Lance mais entradas/saídas conforme forem surgindo.</div>
  </div>
  <div class="card">
    <h3>Lançamentos já feitos para ${nomeMes}</h3>
    ${lancDoMes.length? lancDoMes.map(l=>`<div class="row"><span>${l.type==='entrada'?'🟢':'🔴'} ${l.desc} <span class="muted">(${fmtDate(l.date)})</span></span><b style="color:${l.type==='entrada'?'var(--green)':'var(--ink)'}">${l.type==='entrada'?'+':''}${fmt(l.amount)}</b></div>`).join(''): '<div class="emptyState">Nada lançado ainda para este mês</div>'}
    ${loanNoMes?`<div class="row"><span>Parcela do empréstimo</span><b>${fmt(state.loan.installmentValue)}</b></div>`:''}
    ${dividasNoMes.map(d=>`<div class="row"><span>Dívida: ${d.desc}</span><b>${fmt(d.amount)}</b></div>`).join('')}
    <button class="btn small outline" style="margin-top:10px" onclick="openLancForm(null,null,'${ym}-05')">+ Adicionar lançamento para este mês</button>
  </div>`;
}

  for(let d=1; d<=daysInM; d++){

function exportBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url; a.download = `dione-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toggleDrawer(false);
  toast("Backup exportado");
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast("Arquivo inválido"); return; }
    if(!parsed || parsed.saldo===undefined){ toast("Este arquivo não parece um backup válido"); return; }
    const ok = confirm("Importar este backup vai SUBSTITUIR todos os dados atuais do app. Deseja continuar?");
    if(!ok){ event.target.value=""; return; }
    state = parsed;
    if(!state.undoSnapshots) state.undoSnapshots = [];
    save();
    toggleDrawer(false);
    render();
    toast("Backup importado com sucesso");
    event.target.value = "";
  };
  reader.readAsText(file);
}
function resetAllData(){
  const ok1 = confirm("Isso vai APAGAR TUDO: saldo, lançamentos, cartões, empréstimo, dívidas e caixinhas. Não tem como desfazer. Deseja continuar?");

}

DB.maskMessage=function(el){if(el.dataset.privateProcessed)return;el.dataset.privateProcessed='1';const tree=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;const nodes=[];while(n=tree.nextNode())if(n.nodeValue.includes('R$'))nodes.push(n);for(const node of nodes){const frag=document.createDocumentFragment();let last=0;const re=/R\$\s*[\d.,]+/g;for(const m of node.nodeValue.matchAll(re)){frag.append(node.nodeValue.slice(last,m.index));const span=document.createElement('span');span.className='db-money';span.textContent=m[0];frag.append(span);last=m.index+m[0].length;}frag.append(node.nodeValue.slice(last));node.replaceWith(frag);}};
DB.monthLabel=m=>new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
DB.payments=function(month){const paid=activeLanc().filter(l=>l.type==='saida'&&l.applied&&String(l.date).startsWith(month));const pending=allPendingCommitments().filter(l=>l.type!=='entrada'&&String(l.date).startsWith(month));return {paid,pending,paidTotal:paid.reduce((a,b)=>a+Number(b.amount||0),0),pendingTotal:pending.reduce((a,b)=>a+Number(b.amount||0),0)};};
const oldPrevisao=renderPrevisao;
renderPrevisao=function(){const p=DB.payments(DB.month);return `<div class="card"><h3>Pagamentos de qualquer mês</h3><label for="db-month">Mês e ano</label><input class="db-field" id="db-month" type="month" value="${DB.month}" onchange="DB.month=this.value||todayStr().slice(0,7);render()"><div class="row"><span>Pagos · lançamentos realizados</span><b>${fmt(p.paidTotal)}</b></div><div class="row"><span>A pagar · compromissos em aberto</span><b>${fmt(p.pendingTotal)}</b></div><p class="muted">Não soma faturas e compras para evitar duplicidade. Pagamentos realizados aparecem nos lançamentos; previsões incluem compromissos ainda abertos. Não reconstrói parcelas antigas sem registro.</p>${[...p.paid.map(x=>({...x,label:'Pago'})),...p.pending.map(x=>({...x,label:'Em aberto'}))].map(x=>`<div class="row"><span>${DB.esc(x.desc)}<br><small>${fmtDate(x.date)} · ${x.label}</small></span><b>${fmt(x.amount)}</b></div>`).join('')||'<p>Nenhum registro para esse mês.</p>'}</div><details><summary>Resumo geral e todas as previsões</summary>${oldPrevisao()}</details>`;};
DB.chartHTML=function(){const end=new Date(),months=[];for(let i=5;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1);months.push(localDateStr(d).slice(0,7))}const ins=months.map(m=>totalMesPorTipo(m,'entrada')),outs=months.map(m=>totalMesPorTipo(m,'saida'));const max=Math.max(1,...ins,...outs);const bars=months.map((m,i)=>`<rect x="${i*46+4}" y="${55-ins[i]/max*46}" width="13" height="${ins[i]/max*46}" rx="3" fill="#13a87b"/><rect x="${i*46+20}" y="${55-outs[i]/max*46}" width="13" height="${outs[i]/max*46}" rx="3" fill="#eb765b"/>`).join('');const cats={};activeLanc().filter(x=>x.applied&&x.type==='saida'&&String(x.date).startsWith(todayStr().slice(0,7))).forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount||0));const total=Object.values(cats).reduce((a,b)=>a+b,0);let x=0;const colors=['#367ed6','#e5b44a','#8654c7','#0ba2a0','#eb765b'];const seg=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>{const w=total?v/total*270:0;const r=`<rect x="${x}" y="20" width="${w}" height="16" fill="${colors[i%5]}"/>`;x+=w;return r}).join('');return `<div class="db-charts"><section class="card"><h3>Entradas × despesas</h3><svg class="db-chart" viewBox="0 0 280 65" role="img" aria-label="Entradas em verde e despesas em coral dos últimos seis meses">${bars}</svg><div class="db-small">${DB.monthLabel(months[0])} a ${DB.monthLabel(months[5])}</div><details><summary>Ver valores</summary>${months.map((m,i)=>`<div class="row"><span>${m}</span><span>${fmt(ins[i])} / ${fmt(outs[i])}</span></div>`).join('')}</details></section><section class="card"><h3>Gastos por categoria</h3><b>${fmt(total)}</b><svg class="db-chart" viewBox="0 0 280 65" role="img" aria-label="Distribuição de despesas realizadas no mês atual">${seg}</svg><details><summary>Ver categorias</summary>${Object.entries(cats).map(([k,v])=>`<div class="row"><span>${DB.esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'Nenhuma despesa registrada.'}</details></section></div>`;};
DB.csv=function(){const rows=[['Data','Descrição','Tipo','Categoria','Valor','Status'],...activeLanc().map(l=>[l.date,l.desc,l.type,l.category,l.amount,l.applied?'Realizado':'Pendente'])];const q=x=>'"'+String(x??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='db-lancamentos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
DB.shareBackup=async()=>{try{const file=new File([JSON.stringify(state,null,2)],'db-backup.json',{type:'application/json'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Backup DB'});else exportBackup()}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar. Use Exportar backup.')}};
DB.theme=function(){const s=state.dbSettings.dark;document.body.classList.toggle('db-dark',s==='dark'||(s==='auto'&&(new Date().getHours()<6||new Date().getHours()>=19)))};
DB.settings=function(){return `<div class="card db-settings"><h3>DB · Preferências</h3><p>DIdI usa Jhony nas saudações e respostas.</p><label><input type="checkbox" ${state.dbSettings.voice?'checked':''} onchange="state.dbSettings.voice=this.checked;save()">Respostas faladas da DIdI</label><label>Tema<select class="db-field" onchange="state.dbSettings.dark=this.value;save();DB.theme()"><option value="light" ${state.dbSettings.dark==='light'?'selected':''}>Claro</option><option value="dark" ${state.dbSettings.dark==='dark'?'selected':''}>Escuro</option><option value="auto" ${state.dbSettings.dark==='auto'?'selected':''}>Automático à noite</option></select></label><p>Resumo falado na primeira abertura desbloqueada a partir das 5h. Se o navegador bloquear o áudio, use Ouvir lembretes.</p><button class="btn" onclick="DB.allowNotifications()">Ativar notificações</button><h3>Dados e segurança</h3><div class="db-actions"><button class="btn outline" onclick="exportBackup()">Exportar backup</button><button class="btn outline" onclick="DB.shareBackup()">Compartilhar backup</button><button class="btn outline" onclick="DB.csv()">Exportar CSV</button><button class="btn outline" onclick="document.getElementById('importFile').click()">Importar backup</button><button class="btn outline" onclick="DB.undoHistory()">Histórico de desfazer</button><button class="btn outline" onclick="DB.importLoose()">Importar lançamentos colados</button></div><button class="btn outline" onclick="forgotPw()">Alterar senha local</button></div>`};
DB.importLoose=function(){openSheet('Importar lançamentos','<p>Uma linha por lançamento: data (AAAA-MM-DD); descrição; entrada ou saida; valor (ex.: 15,90). Confira a prévia antes de confirmar.</p><textarea id="db-paste" class="db-field" rows="6"></textarea><button class="btn" onclick="DB.previewLoose()">Conferir prévia</button>')};
DB.previewLoose=function(){try{const lines=document.getElementById('db-paste').value.trim().split(/\n/);DB.importRows=lines.map(s=>{const [date,desc,type,raw]=s.split(';').map(x=>x.trim());const amount=Number(String(raw||'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!desc||!['entrada','saida'].includes(type)||!(amount>0))throw Error();return {date,desc,type,amount}});openSheet('Confirmar importação',DB.importRows.map(r=>`<div class="row"><span>${DB.esc(r.desc)} · ${r.date} · ${r.type}</span><b>${fmt(r.amount)}</b></div>`).join('')+'<p>Serão importados como pendentes, sem alterar o saldo.</p><button class="btn" onclick="DB.commitLoose()">Confirmar</button>')}catch(e){toast('Formato inválido. Revise as linhas.')}};
DB.commitLoose=function(){snapshot();DB.importRows.forEach(r=>state.lancamentos.push({...r,id:uid('lc'),category:r.type==='entrada'?'Outras entradas':'Outras despesas',status:'pendente',applied:false,trashed:false,installments:1,installmentNum:1}));save();closeSheet();render();toast('Importado como pendente')};
DB.eventDate=function(e,birthday=false,now=new Date()){const raw=e.date||e.data||e.dataNascimento||e.nascimento;const time=e.time||e.hora||e.horario||'';if(!raw)return null;let date=String(raw).slice(0,10);if(birthday){const md=date.length===5?date:date.slice(5);date=now.getFullYear()+'-'+md;if(date<localDateStr(now))date=(now.getFullYear()+1)+'-'+md}const d=new Date(date+'T'+(time||'00:00').slice(0,5)+':00');return isNaN(d)?null:d};
DB.eventName=e=>e.title||e.titulo||e.nome||e.name||e.desc||'Compromisso';
DB.eventList=function(){return [...state.agenda.map(e=>({...e,birthday:false})),...state.aniversarios.map(e=>({...e,birthday:true}))]};
DB.agendaHTML=function(){const list=DB.eventList().map(e=>({...e,dt:DB.eventDate(e,e.birthday)})).filter(e=>e.dt).sort((a,b)=>a.dt-b.dt);return `<div class="card"><h3>Agenda e aniversários</h3><div class="db-actions"><button class="btn" onclick="DB.eventForm(false)">+ Compromisso</button><button class="btn gold" onclick="DB.eventForm(true)">+ Aniversário</button></div><p class="muted">Aviso na véspera e, quando houver horário, três horas antes. Resumo da manhã após as 5h.</p>${list.map(e=>`<div class="row"><span>${e.birthday?'🎂':'📅'} ${DB.esc(DB.eventName(e))}<br><small>${e.dt.toLocaleDateString('pt-BR')} ${DB.esc(e.time||e.hora||e.horario||'Dia inteiro')}</small></span><button class="btn outline small" onclick="DB.eventForm(${e.birthday},'${encodeURIComponent(e.id||'')}')">Editar</button></div>`).join('')||'<p>Nenhum evento cadastrado.</p>'}</div>`;};
DB.eventForm=function(birthday,id){const list=birthday?state.aniversarios:state.agenda;const e=list.find(x=>x.id===decodeURIComponent(id||''))||{};DB.editEvent={birthday,id:e.id};openSheet(birthday?'Aniversário':'Compromisso',`<form onsubmit="DB.saveEvent(event)"><label>Nome ou título<input class="db-field" id="ev-title" value="${DB.esc(DB.eventName(e)==='Compromisso'?'':DB.eventName(e))}" required></label><label>Data<input class="db-field" id="ev-date" type="date" value="${DB.esc(e.date||e.data||'')}" required></label><label>Horário (opcional)<input class="db-field" id="ev-time" type="time" value="${DB.esc(e.time||e.hora||'')}"></label><label>Observações<textarea class="db-field" id="ev-notes">${DB.esc(e.notes||e.observacoes||'')}</textarea></label><button class="btn block">Salvar</button></form>${e.id?'<button class="btn danger block" style="margin-top:10px" onclick="DB.deleteEvent()">Excluir</button>':''}`)};
DB.saveEvent=function(ev){ev.preventDefault();snapshot();const e=DB.editEvent,list=e.birthday?state.aniversarios:state.agenda;const old=list.find(x=>x.id===e.id);const data={...old,id:e.id||uid('ev'),title:document.getElementById('ev-title').value,date:document.getElementById('ev-date').value,time:document.getElementById('ev-time').value,notes:document.getElementById('ev-notes').value};if(old)Object.assign(old,data);else list.push(data);save();closeSheet();render();DB.checkReminders(false)};
DB.deleteEvent=function(){if(!confirm('Excluir este evento?'))return;snapshot();const e=DB.editEvent,key=e.birthday?'aniversarios':'agenda';state[key]=state[key].filter(x=>x.id!==e.id);save();closeSheet();render()};
DB.currentReminders=function(now=new Date()){const out=[];for(const e of DB.eventList()){const d=DB.eventDate(e,e.birthday,now);if(!d)continue;const diff=(d-now)/3600000;const t=localDateStr(now),tomorrow=localDateStr(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));const date=localDateStr(d);const title=DB.eventName(e);const hasTime=!!(e.time||e.hora||e.horario);if(date===tomorrow)out.push({key:(e.id||title)+':eve:'+t,text:`Amanhã: ${title}${hasTime?' às '+(e.time||e.hora||e.horario):''}.`});if(date===t){out.push({key:(e.id||title)+':day:'+t,text:`Hoje: ${title}${hasTime?' às '+(e.time||e.hora||e.horario):', dia inteiro'}.`,morning:true});if(hasTime&&diff>=0&&diff<=3)out.push({key:(e.id||title)+':3h:'+t,text:`${title} começa ${diff<1?'em menos de uma hora':'em aproximadamente '+Math.ceil(diff)+' horas'}.`});}}return out};
DB.checkReminders=function(onOpen=false){if(document.getElementById('app').style.display==='none')return;const now=new Date(),date=todayStr(),items=DB.currentReminders(now);DB.events=items;let box=document.getElementById('db-reminders');if(!box){box=document.createElement('section');box.id='db-reminders';document.getElementById('content').prepend(box)}box.innerHTML=items.length?`<div class="db-banner"><h3>Seus lembretes</h3>${[...new Set(items.map(x=>x.text))].map(t=>'<p>'+DB.esc(t)+'</p>').join('')}<button class="btn small" onclick="DB.speakReminders()">Ouvir lembretes</button></div>`:'';let seen;try{seen=JSON.parse(localStorage.getItem('dbReminderSeen')||'{}')}catch{seen={}}for(const item of items.filter(x=>!x.morning)){if(!seen[item.key]){if(state.dbSettings.notifications&&Notification.permission==='granted')navigator.serviceWorker?.ready.then(r=>r.showNotification('DB · Lembrete',{body:item.text})).catch(()=>{});seen[item.key]=true;}}localStorage.setItem('dbReminderSeen',JSON.stringify(Object.fromEntries(Object.entries(seen).filter(([k])=>k.endsWith(date)).slice(-100))));if(onOpen&&now.getHours()>=5&&localStorage.getItem('dbMorning')!==date){localStorage.setItem('dbMorning',date);DB.speakReminders(true)}};
DB.speakReminders=function(greeting=false){const texts=[...new Set(DB.events.map(e=>e.text))];DB.say((greeting?'Bom dia, Jhony. ':'')+(texts.length?texts.join(' '):'Você não tem lembretes para hoje ou amanhã.'))};
DB.allowNotifications=async()=>{if(!('Notification'in window))return toast('Este navegador não oferece notificações');const p=await Notification.requestPermission();state.dbSettings.notifications=p==='granted';save();toast(p==='granted'?'Ativadas enquanto o navegador permitir execução':'Notificações não autorizadas')};
DB.fetchJSON=async url=>{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}};
DB.fxUpdate=async()=>{try{const r=await DB.fetchJSON('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,BRL');if(!(r.rates?.BRL>0&&r.rates?.USD>0))throw Error();DB.fx={eur:r.rates.BRL,usd:r.rates.BRL/r.rates.USD,date:r.date,at:new Date().toISOString()};localStorage.setItem('dbFx',JSON.stringify(DB.fx));render();return DB.fx}catch(e){toast('Câmbio indisponível. Exibindo último dado salvo, se houver.');return null}};
DB.fxHTML=()=>`<div class="card"><h3>Dólar e euro em reais</h3>${DB.fx?`<div class="grid2"><div><span>US$ 1</span><b>${fmt(DB.fx.usd)}</b></div><div><span>€ 1</span><b>${fmt(DB.fx.eur)}</b></div></div><p class="muted">Taxa de referência · ${DB.esc(DB.fx.date)} · consultada em ${new Date(DB.fx.at).toLocaleString('pt-BR')}. Frankfurter. Não é cotação de turismo em tempo real.</p>`:'<p>Toque em atualizar para consultar as cotações.</p>'}<button class="btn outline" onclick="DB.fxUpdate()">Atualizar cotações</button></div>`;
DB.weatherCode=c=>c===0?'Céu limpo':c<=3?'Sol entre nuvens':c<=48?'Neblina':c>=95?'Trovoadas':c>=71&&c<=77?'Neve':'Chuva';
DB.weatherUpdate=async function(city,coordinates){try{let loc=coordinates;if(!loc){const g=await DB.fetchJSON('https://geocoding-api.open-meteo.com/v1/search?count=5&language=pt&name='+encodeURIComponent(city));if(!g.results?.length)throw Error('Cidade não encontrada');if(g.results.length>1){DB.locations=g.results;openSheet('Escolha a cidade',g.results.map((x,i)=>`<button class="btn outline block" style="margin:7px 0" onclick="DB.chooseCity(${i})">${DB.esc(x.name)}, ${DB.esc(x.admin1)}, ${DB.esc(x.country)}</button>`).join(''));return null}loc=g.results[0]}const w=await DB.fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);if(!w.daily?.time?.length)throw Error('Previsão vazia');DB.weather={...w,place:loc.name||'Minha localização',at:new Date().toISOString()};localStorage.setItem('dbWeather',JSON.stringify(DB.weather));render();return DB.weather}catch(e){toast(e.message||'Não foi possível consultar o tempo');return null}};
DB.chooseCity=i=>{const loc=DB.locations[i];closeSheet();return DB.weatherUpdate('',loc)};
DB.locate=function(){if(!navigator.geolocation)return toast('Localização não disponível');navigator.geolocation.getCurrentPosition(p=>DB.weatherUpdate('',{latitude:p.coords.latitude,longitude:p.coords.longitude,name:'Minha localização'}),()=>toast('Localização não autorizada. Digite sua cidade.'))};
DB.weatherHTML=function(){const w=DB.weather;return `<div class="card"><h3>Tempo do dia e da semana</h3><form class="db-actions" onsubmit="event.preventDefault();DB.weatherUpdate(this.elements.city.value)"><input name="city" aria-label="Cidade" class="f" placeholder="Digite a cidade" required><button class="btn">Buscar</button><button type="button" class="btn outline" onclick="DB.locate()">Minha localização</button></form>${w?`<h2>${DB.esc(w.place)} · ${Math.round(w.current.temperature_2m)}°C</h2><p>${DB.weatherCode(w.current.weather_code)}</p><div class="db-week">${w.daily.time.map((d,i)=>`<div class="db-day">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'})}<strong>${Math.round(w.daily.temperature_2m_max[i])}° / ${Math.round(w.daily.temperature_2m_min[i])}°</strong>${DB.weatherCode(w.daily.weather_code[i])}<br>Chuva: ${w.daily.precipitation_probability_max[i]??'—'}%</div>`).join('')}</div><p class="muted">Open-Meteo · consulta ${new Date(w.at).toLocaleString('pt-BR')} · fuso ${DB.esc(w.timezone)}. Dados salvos; atualize para obter nova previsão.</p>`:'<p>Escolha uma cidade para ver os próximos sete dias.</p>'}</div>`};
DB.trips=function(){const extra=state.viagem?(Array.isArray(state.viagem)?state.viagem:[state.viagem]):[];return [...extra,...state.dbTrips]};
DB.tripsHTML=function(){return `<div class="db-trip"><h2>Viagens</h2><p>Destinos, reservas e roteiro em um só lugar.</p><button class="btn" onclick="DB.tripForm()">+ Viagem</button></div>${DB.fxHTML()}${DB.trips().map((t,i)=>`<div class="card"><h3>${DB.esc(t.destination||t.destino||t.title||t.nome||'Viagem')}</h3><p>${DB.esc(t.start||t.inicio||t.dataInicio||'')} a ${DB.esc(t.end||t.fim||t.dataFim||'')}</p><p>Hotel: ${DB.esc(t.hotel||'Não informado')}</p><div style="white-space:pre-wrap">${DB.esc(typeof(t.itinerary||t.roteiro)==='string'?(t.itinerary||t.roteiro):JSON.stringify(t.itinerary||t.roteiro||'',null,2))}</div><div class="db-actions"><button class="btn outline" onclick="DB.tripMap(${i})">Abrir mapa</button>${state.dbTrips.includes(t)?`<button class="btn outline" onclick="DB.tripForm('${encodeURIComponent(t.id)}')">Editar</button>`:''}</div></div>`).join('')||'<div class="card">Nenhuma viagem cadastrada.</div>'}`};
DB.tripMap=i=>{const t=DB.trips()[i],q=t.destination||t.destino||t.title;if(!q)return toast('Cadastre o destino');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener')};
DB.tripForm=function(id){const t=state.dbTrips.find(x=>x.id===decodeURIComponent(id||''))||{};DB.tripEditing=t.id;openSheet('Viagem',`<form onsubmit="DB.saveTrip(event)"><label>Destino<input class="db-field" id="tr-dest" required value="${DB.esc(t.destination)}"></label><label>Ida<input class="db-field" type="date" id="tr-start" required value="${DB.esc(t.start)}"></label><label>Volta<input class="db-field" type="date" id="tr-end" required value="${DB.esc(t.end)}"></label><label>Hotel<input class="db-field" id="tr-hotel" value="${DB.esc(t.hotel)}"></label><label>Roteiro por dia / reservas<textarea class="db-field" rows="8" id="tr-plan">${DB.esc(t.itinerary)}</textarea></label><button class="btn block">Salvar</button></form>`)};
DB.saveTrip=function(e){e.preventDefault();const start=document.getElementById('tr-start').value,end=document.getElementById('tr-end').value;if(end<start)return toast('Volta anterior à ida');snapshot();const t={id:DB.tripEditing||uid('trip'),destination:document.getElementById('tr-dest').value,start,end,hotel:document.getElementById('tr-hotel').value,itinerary:document.getElementById('tr-plan').value};const old=state.dbTrips.find(x=>x.id===t.id);if(old)Object.assign(old,t);else state.dbTrips.push(t);save();closeSheet();render()};
DB.contactsHTML=function(){return `<div class="card"><h3>Contatos da DIdI</h3><p>Selecione no Android os contatos que deseja salvar neste navegador. O site não pode pesquisar a agenda inteira sem essa seleção.</p><div class="db-actions"><button class="btn" onclick="DB.pickContacts()">Selecionar no celular</button><button class="btn outline" onclick="DB.contactForm()">Adicionar manualmente</button></div>${state.contatos.map((c,i)=>`<div class="row"><span>${DB.esc(c.name||c.nome)}</span><button class="btn small" onclick="DB.chooseContact(${i})">Falar com contato</button></div>`).join('')}</div>`};
DB.addContacts=function(items){snapshot();items.forEach(c=>{const name=Array.isArray(c.name)?c.name[0]:c.name;const phones=(Array.isArray(c.tel)?c.tel:[c.phone||c.telefone||c.tel]).filter(Boolean);for(const phone of phones)if(!state.contatos.some(x=>(x.name||x.nome)===name&&(x.phone||x.telefone)===phone))state.contatos.push({id:uid('ct'),name,phone})});save();render()};

DB.parseMonth=function(text){const t=DB.norm(text),now=new Date();const months=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];const idx=months.findIndex(m=>new RegExp('\\b'+m+'\\b').test(t)),year=t.match(/\b20\d{2}\b/);if(idx>=0)return (year?year[0]:now.getFullYear())+'-'+String(idx+1).padStart(2,'0');const numeric=t.match(/\b(0?[1-9]|1[0-2])\/(20\d{2})\b/);if(numeric)return numeric[2]+'-'+numeric[1].padStart(2,'0');if(/passado|anterior/.test(t))now.setMonth(now.getMonth()-1);else if(/proximo|seguinte/.test(t))now.setMonth(now.getMonth()+1);return localDateStr(now).slice(0,7)};

DB.handle=async function(text){const t=DB.norm(text).replace(/^didi\s*/,'');if(!t)return;if(/^(cancelar|cancele|parar|pare|chega)$/.test(t)){DB.flow=null;DB.stopVoice();DB.say('Certo, Jhony. Cancelei.');return true}
if(DB.flow?.stage==='duplicate'){const opts=DB.flow.contacts;const ord={'primeiro':0,'primeira':0,'segundo':1,'segunda':1,'terceiro':2,'terceira':2};let i=ord[t];if(i===undefined&&/^\d+$/.test(t))i=Number(t)-1;let matches=opts.filter(c=>DB.norm(c.name||c.nome)===t);const c=i!==undefined?opts[i]:(matches.length===1?matches[0]:null);if(!c){DB.say('Diga o número da opção ou o nome completo.');return true}DB.flow={stage:'method',contact:c};DB.say('Quer WhatsApp, vídeo no WhatsApp ou ligação normal?');DB.contactOptions();return true}

if(DB.flow?.stage==='event-time'){const match=t.match(/\b([01]?\d|2[0-3])(?:\s*(?::|h|horas?)\s*([0-5]\d)?)?\b/);if(!match&&!/inteiro|sem horario/.test(t)){DB.say('Diga o horário ou dia inteiro.');return true}DB.flow.time=match?match[1].padStart(2,'0')+':'+(match[2]||'00'):'';DB.flow.stage='event-confirm';DB.say(`Vou cadastrar ${DB.flow.title} em ${fmtDate(DB.flow.date)} ${DB.flow.time||'dia inteiro'}. Confirmar?`);return true}
if(DB.flow?.stage==='event-confirm'){if(/^(sim|confirmo|confirmar|pode|pode salvar|salvar)$/.test(t)){snapshot();const f=DB.flow;state[f.birthday?'aniversarios':'agenda'].push({id:uid('ev'),title:f.title,date:f.date,time:f.time});DB.flow=null;save();render();DB.say('Salvei, Jhony. Os lembretes estão configurados.')}else DB.say('Diga sim para salvar ou cancelar.');return true}
const call=t.match(/(?:ligue|ligar|chame|chamar|telefone)(?:\s+(?:para|pra|a|o))?\s+(.+)/);if(call){const name=call[1].replace(/^(a|o)\s+/,'');const exact=state.contatos.filter(c=>DB.norm(c.name||c.nome)===name);const found=exact.length?exact:state.contatos.filter(c=>DB.norm(c.name||c.nome).split(/\s+/).includes(name)||DB.norm(c.name||c.nome).startsWith(name+' '));if(!found.length){DB.say('Jhony, não encontrei esse nome nos contatos salvos. Abra Contatos e selecione as pessoas da sua agenda, ou adicione manualmente.');return true}if(found.length>1){DB.flow={stage:'duplicate',contacts:found};DB.say('Encontrei mais de um contato. '+found.map((c,i)=>`${i+1}: ${c.name||c.nome}, telefone terminado em ${String(c.phone||c.telefone||'').slice(-4)}`).join('. ')+'. Qual opção?');}else{DB.flow={stage:'method',contact:found[0]};DB.say('Jhony, encontrei '+(found[0].name||found[0].nome)+'. Quer WhatsApp, vídeo no WhatsApp ou ligação normal?');DB.contactOptions()}return true}

if(/pagamentos|previsao.*pagar|contas.*(?:mes|pagar)|paguei|pagar.*mes/.test(t)){const month=DB.parseMonth(t),p=DB.payments(month);DB.month=month;goTab('previsao');DB.say('Jhony, em '+DB.monthLabel(month)+': pagamentos realizados de '+DB.rawMoney(p.paidTotal)+' e compromissos em aberto de '+DB.rawMoney(p.pendingTotal)+'. '+(p.pending.length?p.pending.slice(0,8).map(x=>x.desc+', '+DB.rawMoney(x.amount)).join('; '):'Não há pendências registradas nesse mês.')+' Valores pagos incluem somente lançamentos realizados.');return true}
if(/dolar|euro|cotacao|cambio/.test(t)){const r=await DB.fxUpdate();if(r)DB.say(`Jhony, um dólar corresponde a ${DB.rawMoney(r.usd)} e um euro a ${DB.rawMoney(r.eur)}. Taxa de referência de ${r.date}.`);else DB.say('Não consegui atualizar as cotações. Tente novamente mais tarde.');return true}
if(/tempo|clima|chover|chuva|temperatura/.test(t)){goTab('tempo');const city=t.match(/(?:tempo|clima|temperatura|chover|chuva).*?\b(?:em|para)\s+(.+)/)?.[1];if(city){const w=await DB.weatherUpdate(city);if(w)DB.say(DB.weatherSpeech())}else if(DB.weather)DB.say(DB.weatherSpeech());else{DB.flow={stage:'weather-city'};DB.say('De qual cidade você quer a previsão?')}return true}
if(/aniversario|agenda|compromissos|lembretes/.test(t)){goTab('agenda');const e=DB.eventList().map(x=>({...x,dt:DB.eventDate(x,x.birthday)})).filter(x=>x.dt&&localDateStr(x.dt)>=todayStr()).sort((a,b)=>a.dt-b.dt);DB.say(e.length?'Jhony, seus próximos eventos: '+e.slice(0,8).map(x=>DB.eventName(x)+', '+x.dt.toLocaleDateString('pt-BR')+' '+(x.time||x.hora||'dia inteiro')).join('; '):'Jhony, você não tem eventos futuros cadastrados.');return true}
if(/cartao|cartoes|fatura|vencimento|fechamento/.test(t)&&!/mensal/.test(t)){goTab('cartoes');const match=state.cards.filter(c=>t.includes(DB.norm(c.name)));const cards=match.length?match:state.cards;DB.say('Jhony, '+cards.map(c=>`${c.name}: vencimento dia ${c.dueDay||'não informado'}, fechamento ${c.closingDay?'dia '+c.closingDay:'não informado'}, melhor dia ${c.bestDay||'não informado'}, limite ${DB.rawMoney(c.limit)}.`).join(' '));return true}

if(/caixinha|reservado/.test(t)){goTab('caixinhas');DB.say('Jhony, o total em caixinhas é '+DB.rawMoney(caixinhasTotal())+'. '+state.boxes.map(x=>x.name+': '+DB.rawMoney(x.balance)).join('. '));return true}
if(/emprestimo|divida/.test(t)){goTab('emprestimo');DB.say('Jhony, empréstimo restante de '+DB.rawMoney(loanRemaining())+' e dívidas em aberto de '+DB.rawMoney(dividasTotal())+'.');return true}
if(/historico.*desfazer/.test(t)){DB.undoHistory();DB.say('Jhony, abri os pontos de restauração. Escolha o ponto na tela.');return true}
if(/ocultar valores|esconder valores|mostrar valores/.test(t)){DB.hidden=!/mostrar/.test(t);localStorage.setItem('dbHide',DB.hidden?'1':'0');DB.privacy();DB.say(DB.hidden?'Valores ocultos.':'Valores visíveis.');return true}
if(/historico|relatorio|projecao|fechamento mensal/.test(t)){const id=/historico/.test(t)?'historico':/projecao/.test(t)?'projecao':/fechamento/.test(t)?'fechamento':'relatorios';goTab(id);DB.say('Jhony, '+(id==='projecao'?'a estimativa média mensal é '+DB.rawMoney(monthlyNetEstimate()):id==='historico'?state.history.slice(0,5).map(x=>x.text).join('. '):'as entradas no mês são '+DB.rawMoney(totalMesPorTipo(todayStr().slice(0,7),'entrada'))+' e as saídas '+DB.rawMoney(totalMesPorTipo(todayStr().slice(0,7),'saida')))+'.');return true}
return false};
DB.parseDate=function(text){const t=DB.norm(text),now=new Date();if(t==='hoje')return todayStr();if(t==='amanha'){now.setDate(now.getDate()+1);return localDateStr(now)}let m=t.match(/(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);let y,mo,day;if(m){day=+m[1];mo=+m[2];y=+m[3]}else{const months=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];mo=months.findIndex(x=>t.includes(x))+1;day=Number(t.match(/\b\d{1,2}\b/)?.[0]);y=Number(t.match(/\b20\d{2}\b/)?.[0]||now.getFullYear())}const d=new Date(y,mo-1,day);return mo&&day&&d.getDate()===day&&d.getMonth()===mo-1?localDateStr(d):null};
DB.weatherSpeech=function(){const w=DB.weather;if(!w)return 'Previsão indisponível.';return 'Jhony, previsão para '+w.place+', consultada em '+new Date(w.at).toLocaleString('pt-BR')+'. '+w.daily.time.map((d,i)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'})+': mínima '+Math.round(w.daily.temperature_2m_min[i])+' e máxima '+Math.round(w.daily.temperature_2m_max[i])+' graus; chance de chuva '+w.daily.precipitation_probability_max[i]+' por cento').join('. ')};
DB.bootVoice=function(){const panel=document.getElementById('didiPanel');if(!panel)return;const info=document.createElement('div');info.id='db-voice-status';info.className='db-voice-state';info.setAttribute('role','status');info.textContent='Toque no microfone para conversar';panel.querySelector('.didiHead').after(info);const repeat=document.createElement('button');repeat.className='btn small outline';repeat.textContent='Ouvir resposta';repeat.onclick=()=>{if(DB.lastSpoken)DB.say(DB.lastSpoken)};panel.querySelector('.didiQuick').append(repeat);panel.querySelector('.didiClose').onclick=()=>{DB.stopVoice();window.speechSynthesis?.cancel();panel.classList.remove('open')};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('didiMic');if(SR){const r=new SR();r.lang='pt-BR';r.interimResults=false;r.continuous=false;DB.rec=r;r.onstart=()=>{mic.classList.add('active');DB.voiceStatus('Ouvindo… diga cancelar para encerrar')};r.onresult=e=>{DB.heard=true;DB.dispatch(e.results[0][0].transcript)};r.onend=()=>{mic.classList.remove('active');if(DB.voice&&!DB.speaking&&!DB.processing){if(DB.heard){DB.heard=false}else{DB.stopVoice();DB.voiceStatus('Sem resposta. Toque no microfone para continuar.')}}};r.onerror=e=>{if(e.error!=='aborted'){DB.stopVoice();DB.voiceStatus('Não foi possível ouvir: '+e.error+'. Toque para tentar novamente ou digite.')}};mic.onclick=()=>{if(DB.voice)DB.stopVoice();else{DB.voice=true;DB.listen()}}}else mic.onclick=()=>DB.say('Reconhecimento de voz indisponível neste navegador. Você pode digitar.');new MutationObserver(()=>DB.privacy()).observe(document.getElementById('didiBody'),{childList:true});};
DB.dispatch=async function(text){if(DB.processing)return;DB.processing=true;DB.addVoiceUser(text);try{const handled=await DB.handle(text);if(!handled){window.DBDispatching=true;try{window.DBOriginalHandle(text)}finally{window.DBDispatching=false}}}catch(e){DB.flow=null;DB.say('Não consegui concluir. Você pode tentar novamente ou usar os controles da tela.')}finally{DB.processing=false}};

DB.movementChart=function(){
 const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return localDateStr(d)});
 const moves=state.movements.filter(m=>!/caixinha|empréstimo|emprestimo|dívida|divida/i.test(m.desc));
 const income=days.map(d=>moves.filter(m=>m.type==='credito'&&localDateStr(new Date(m.ts))===d).reduce((sum,m)=>sum+Number(m.amount||0),0));
 const expense=days.map(d=>moves.filter(m=>m.type!=='credito'&&localDateStr(new Date(m.ts))===d).reduce((sum,m)=>sum+Number(m.amount||0),0));
 const top=Math.max(1,...income,...expense);const cols=days.map((d,i)=>{const x=34+i*42;const hi=income[i]/top*58,he=expense[i]/top*58;return `<rect x="${x}" y="${76-hi}" width="12" height="${hi}" rx="4" fill="#17a77e"/><rect x="${x+14}" y="${76-he}" width="12" height="${he}" rx="4" fill="#ec8066"/><text x="${x+13}" y="96" text-anchor="middle" fill="var(--ink-soft)" font-size="11">${d.slice(8)}/${d.slice(5,7)}</text>`}).join('');
 return `<div class="db-move-chart"><div class="db-small">Últimos 7 dias · entradas e saídas</div><div class="db-chart" style="height:auto"><svg viewBox="0 0 340 110" style="width:100%;max-height:155px;display:block" role="img" aria-label="Entradas em verde e saídas em coral, agrupadas por dia, nos últimos sete dias"><path d="M28 76H330M28 46H330M28 16H330" stroke="var(--line)" stroke-width="1" fill="none"/>${cols}</svg></div><div class="db-move-legend"><span><i style="background:#17a77e"></i>Entradas ${fmt(income.reduce((a,b)=>a+b,0))}</span><span><i style="background:#ec8066"></i>Saídas ${fmt(expense.reduce((a,b)=>a+b,0))}</span></div><details class="db-small"><summary>Valores por dia</summary>${days.map((d,i)=>`<div class="row"><span>${fmtDate(d)}</span><span>+ ${fmt(income[i])} / − ${fmt(expense[i])}</span></div>`).join('')}</details></div>`;
};
