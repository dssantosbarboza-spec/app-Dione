    say('Entendi. Posso registrar gastos e entradas, consultar seu saldo e seus gastos do mês, ou desfazer o último lançamento.');
  }
  function open(){document.querySelector('#didiPanel').classList.add('open');document.querySelector('#didiFab').style.display='none'}
  function close(){document.querySelector('#didiPanel').classList.remove('open');document.querySelector('#didiFab').style.display='block'}
  function init(){
    const panel=document.createElement('div');panel.id='didiPanel';panel.innerHTML='<div class="didiHead"><b>🤖 DIdI</b><button class="didiClose">×</button></div><div class="didiBody" id="didiBody"><div class="didiMsg didiBot">Olá, Jhony 👋 Sou a DIdI. O que você quer fazer?</div><div class="didiQuick"><button data-q="Meu saldo">Meu saldo</button><button data-q="Quanto gastei esse mês?">Gastos do mês</button><button data-q="Desfaz o último lançamento">Desfazer</button></div></div><div class="didiInput"><input id="didiText" placeholder="Fale ou digite para a DIdI..."><button class="didiMic" id="didiMic">🎙️</button><button id="didiSend">➤</button></div>';
    const fab=document.createElement('button');fab.id='didiFab';fab.textContent='🤖';fab.title='Abrir DIdI';document.body.append(panel,fab);fab.onclick=open;panel.querySelector('.didiClose').onclick=close;
    panel.querySelector('#didiSend').onclick=()=>{const i=panel.querySelector('#didiText');window.DB?DB.dispatch(i.value):handle(i.value);i.value=''};
    panel.querySelector('#didiText').addEventListener('keydown',e=>{if(e.key==='Enter')panel.querySelector('#didiSend').click()});
    panel.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>window.DB?DB.dispatch(b.dataset.q):handle(b.dataset.q));
    const mic=panel.querySelector('#didiMic'); const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){const r=new SR();r.lang='pt-BR';r.interimResults=false;r.onstart=()=>mic.classList.add('active');r.onend=()=>mic.classList.remove('active');r.onresult=e=>handle(e.results[0][0].transcript);mic.onclick=()=>r.start();}else mic.onclick=()=>say('Seu navegador não disponibilizou reconhecimento de voz. Você pode digitar aqui.');
  }
  window.DBOriginalHandle=handle;
  init();
})();
</script>
<script>/* DB upgrade. Existing financial calculations are intentionally retained. */
const DB={esc:v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),month:todayStr().slice(0,7),hidden:DBStore.safeGet('dbHide')!=='0',weather:null,fx:null,voice:false,flow:null,events:[],heard:false};
DB.rawMoney=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const originalFmt=fmt;
fmt=n=>`<span class="db-money">${originalFmt(n)}</span>`;
DB.normalize=function(){const defaults=DEFAULT_STATE();for(const [k,v] of Object.entries(defaults))if(state[k]===undefined)state[k]=v;for(const k of ['agenda','aniversarios','contatos','dbTrips'])if(!Array.isArray(state[k]))state[k]=[];state.dbSettings=Object.assign({voice:true,morningHour:5,dark:'auto',notifications:false},state.dbSettings||{});};window.DB=DB;DB.normalize();
DB.snapshotData=()=>{const {undoSnapshots,...rest}=state;return JSON.parse(JSON.stringify(rest))};
snapshot=function(){state.undoSnapshots.push({ts:new Date().toISOString(),data:DB.snapshotData()});if(state.undoSnapshots.length>20)state.undoSnapshots.shift();};
DB.readSnapshot=function(value){let x=typeof value==='string'?JSON.parse(value):value;if(x&&x.data)return {ts:x.ts,data:typeof x.data==='string'?JSON.parse(x.data):x.data};return {ts:null,data:x};};
DB.restore=function(index){const points=state.undoSnapshots;const point=DB.readSnapshot(points[index]);if(!point.data||typeof point.data!=='object')return toast('Ponto inválido');if(!confirm('Restaurar este ponto e desfazer todas as alterações posteriores?'))return;DB.restoreCopy=JSON.stringify(state);try{sessionStorage.setItem('dbBeforeRestore',DB.restoreCopy)}catch(e){toast('Cópia de recuperação mantida nesta sessão. Exporte um backup para guardar.');}const pass=state.password;state=Object.assign(DEFAULT_STATE(),point.data,{undoSnapshots:points.slice(0,index)});if(!state.password)state.password=pass;DB.normalize();logHist('Ponto de restauração recuperado');save();closeSheet();render();};
undoLast=function(){if(!state.undoSnapshots.length)return toast('Nada para desfazer');DB.restore(state.undoSnapshots.length-1)};
DB.undoHistory=function(){openSheet('Histórico de desfazer','<p>Restaurar desfaz as alterações posteriores ao ponto escolhido. Uma cópia anterior à restauração fica disponível nesta sessão. Exporte um backup para guardá-la.</p>'+state.undoSnapshots.map((s,i)=>{let p;try{p=DB.readSnapshot(s)}catch(e){return ''}return `<div class="row"><span>${p.ts?new Date(p.ts).toLocaleString('pt-BR'):'Ponto anterior '+(i+1)}</span><button class="btn small" onclick="DB.restore(${i})">Restaurar</button></div>`}).reverse().join('')+'<button class="btn outline block" onclick="DB.recoverRestore()">Recuperar cópia anterior à restauração</button>');};
DB.recoverRestore=()=>{const raw=(sessionStorage.getItem('dbBeforeRestore')||DB.restoreCopy);if(!raw)return toast('Nenhuma cópia disponível');if(confirm('Recuperar a cópia anterior à restauração?')){state=JSON.parse(raw);DB.normalize();save();closeSheet();render()}};
DB.toggleMoney=function(){DB.hidden=!DB.hidden;localStorage.setItem('dbHide',DB.hidden?'1':'0');DB.privacy()};
DB.privacy=function(){document.body.classList.toggle('db-hidden',DB.hidden);const b=document.getElementById('db-eye');if(b){b.textContent=DB.hidden?'👁 Mostrar valores':'👁 Ocultar valores';b.setAttribute('aria-label',DB.hidden?'Mostrar valores':'Ocultar valores');b.setAttribute('aria-pressed',String(DB.hidden));b.title=DB.hidden?'Mostrar valores':'Ocultar valores';}document.querySelectorAll('#didiBody .didiMsg').forEach(DB.maskMessage)};
DB.maskMessage=function(el){if(el.dataset.privateProcessed)return;el.dataset.privateProcessed='1';const tree=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;const nodes=[];while(n=tree.nextNode())if(n.nodeValue.includes('R$'))nodes.push(n);for(const node of nodes){const frag=document.createDocumentFragment();let last=0;const re=/R\$\s*[\d.,]+/g;for(const m of node.nodeValue.matchAll(re)){frag.append(node.nodeValue.slice(last,m.index));const span=document.createElement('span');span.className='db-money';span.textContent=m[0];frag.append(span);last=m.index+m[0].length;}frag.append(node.nodeValue.slice(last));node.replaceWith(frag);}};
DB.monthLabel=m=>new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
DB.payments=function(month){const paid=activeLanc().filter(l=>l.type==='saida'&&l.applied&&String(l.date).startsWith(month));const pending=allPendingCommitments().filter(l=>l.type!=='entrada'&&String(l.date).startsWith(month));return {paid,pending,paidTotal:paid.reduce((a,b)=>a+Number(b.amount||0),0),pendingTotal:pending.reduce((a,b)=>a+Number(b.amount||0),0)};};
const oldPrevisao=renderPrevisao;
renderPrevisao=function(){const p=DB.payments(DB.month);return `<div class="card"><h3>Pagamentos de qualquer mês</h3><label for="db-month">Mês e ano</label><input class="db-field" id="db-month" type="month" value="${DB.month}" onchange="DB.month=this.value||todayStr().slice(0,7);render()"><div class="row"><span>Pagos · lançamentos realizados</span><b>${fmt(p.paidTotal)}</b></div><div class="row"><span>A pagar · compromissos em aberto</span><b>${fmt(p.pendingTotal)}</b></div><p class="muted">Não soma faturas e compras para evitar duplicidade. Pagamentos realizados aparecem nos lançamentos; previsões incluem compromissos ainda abertos. Não reconstrói parcelas antigas sem registro.</p>${[...p.paid.map(x=>({...x,label:'Pago'})),...p.pending.map(x=>({...x,label:'Em aberto'}))].map(x=>`<div class="row"><span>${DB.esc(x.desc)}<br><small>${fmtDate(x.date)} · ${x.label}</small></span><b>${fmt(x.amount)}</b></div>`).join('')||'<p>Nenhum registro para esse mês.</p>'}</div><details><summary>Resumo geral e todas as previsões</summary>${oldPrevisao()}</details>`;};
DB.chartHTML=function(){const end=new Date(),months=[];for(let i=5;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1);months.push(localDateStr(d).slice(0,7))}const ins=months.map(m=>totalMesPorTipo(m,'entrada')),outs=months.map(m=>totalMesPorTipo(m,'saida'));const max=Math.max(1,...ins,...outs);const bars=months.map((m,i)=>`<rect x="${i*46+4}" y="${55-ins[i]/max*46}" width="13" height="${ins[i]/max*46}" rx="3" fill="#13a87b"/><rect x="${i*46+20}" y="${55-outs[i]/max*46}" width="13" height="${outs[i]/max*46}" rx="3" fill="#eb765b"/>`).join('');const cats={};activeLanc().filter(x=>x.applied&&x.type==='saida'&&String(x.date).startsWith(todayStr().slice(0,7))).forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount||0));const total=Object.values(cats).reduce((a,b)=>a+b,0);let x=0;const colors=['#367ed6','#e5b44a','#8654c7','#0ba2a0','#eb765b'];const seg=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>{const w=total?v/total*270:0;const r=`<rect x="${x}" y="20" width="${w}" height="16" fill="${colors[i%5]}"/>`;x+=w;return r}).join('');return `<div class="db-charts"><section class="card"><h3>Entradas × despesas</h3><svg class="db-chart" viewBox="0 0 280 65" role="img" aria-label="Entradas em verde e despesas em coral dos últimos seis meses">${bars}</svg><div class="db-small">${DB.monthLabel(months[0])} a ${DB.monthLabel(months[5])}</div><details><summary>Ver valores</summary>${months.map((m,i)=>`<div class="row"><span>${m}</span><span>${fmt(ins[i])} / ${fmt(outs[i])}</span></div>`).join('')}</details></section><section class="card"><h3>Gastos por categoria</h3><b>${fmt(total)}</b><svg class="db-chart" viewBox="0 0 280 65" role="img" aria-label="Distribuição de despesas realizadas no mês atual">${seg}</svg><details><summary>Ver categorias</summary>${Object.entries(cats).map(([k,v])=>`<div class="row"><span>${DB.esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'Nenhuma despesa registrada.'}</details></section></div>`;};
DB.csv=function(){const rows=[['Data','Descrição','Tipo','Categoria','Valor','Status'],...activeLanc().map(l=>[l.date,l.desc,l.type,l.category,l.amount,l.applied?'Realizado':'Pendente'])];const q=x=>'"'+String(x??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='db-lancamentos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
DB.shareBackup=async()=>{try{const file=new File([JSON.stringify(state,null,2)],'db-backup.json',{type:'application/json'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Backup DB'});else exportBackup()}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar. Use Exportar backup.')}};
DB.theme=function(){const s=state.dbSettings.dark;document.body.classList.toggle('db-dark',s==='dark'||(s==='auto'&&(new Date().getHours()<6||new Date().getHours()>=19)))};
DB.settings=function(){return `<div class="card db-settings"><h3>DB · Preferências</h3><p>DIdI usa Jhony nas saudações e respostas.</p><label><input type="checkbox" ${state.dbSettings.voice?'checked':''} onchange="state.dbSettings.voice=this.checked;save()">Respostas faladas da DIdI</label><label>Tema<select class="db-field" onchange="state.dbSettings.dark=this.value;save();DB.theme()"><option value="light" ${state.dbSettings.dark==='light'?'selected':''}>Claro</option><option value="dark" ${state.dbSettings.dark==='dark'?'selected':''}>Escuro</option><option value="auto" ${state.dbSettings.dark==='auto'?'selected':''}>Automático à noite</option></select></label><p>Resumo falado na primeira abertura desbloqueada a partir das 5h. Se o navegador bloquear o áudio, use Ouvir lembretes.</p><button class="btn" onclick="DB.allowNotifications()">Ativar notificações</button><h3>Dados e segurança</h3><div class="db-actions"><button class="btn outline" onclick="exportBackup()">Exportar backup</button><button class="btn outline" onclick="DB.shareBackup()">Compartilhar backup</button><button class="btn outline" onclick="DB.csv()">Exportar CSV</button><button class="btn outline" onclick="document.getElementById('importFile').click()">Importar backup</button><button class="btn outline" onclick="DB.undoHistory()">Histórico de desfazer</button><button class="btn outline" onclick="DB.importLoose()">Importar lançamentos colados</button></div><button class="btn outline" onclick="forgotPw()">Alterar senha local</button></div>`};
DB.importLoose=function(){openSheet('Importar lançamentos','<p>Uma linha por lançamento: data (AAAA-MM-DD); descrição; entrada ou saida; valor (ex.: 15,90). Confira a prévia antes de confirmar.</p><textarea id="db-paste" class="db-field" rows="6"></textarea><button class="btn" onclick="DB.previewLoose()">Conferir prévia</button>')};
DB.previewLoose=function(){try{const lines=document.getElementById('db-paste').value.trim().split(/\n/);DB.importRows=lines.map(s=>{const [date,desc,type,raw]=s.split(';').map(x=>x.trim());const amount=Number(String(raw||'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!desc||!['entrada','saida'].includes(type)||!(amount>0))throw Error();return {date,desc,type,amount}});openSheet('Confirmar importação',DB.importRows.map(r=>`<div class="row"><span>${DB.esc(r.desc)} · ${r.date} · ${r.type}</span><b>${fmt(r.amount)}</b></div>`).join('')+'<p>Serão importados como pendentes, sem alterar o saldo.</p><button class="btn" onclick="DB.commitLoose()">Confirmar</button>')}catch(e){toast('Formato inválido. Revise as linhas.')}};
DB.commitLoose=function(){snapshot();DB.importRows.forEach(r=>state.lancamentos.push({...r,id:uid('lc'),category:r.type==='entrada'?'Outras entradas':'Outras despesas',status:'pendente',applied:false,trashed:false,installments:1,installmentNum:1}));save();closeSheet();render();toast('Importado como pendente')};
DB.eventDate=function(e,birthday=false,now=new Date()){const raw=e.date||e.data||e.dataNascimento||e.nascimento;const time=e.time||e.hora||e.horario||'';if(!raw)return null;let date=String(raw).slice(0,10);if(birthday){const md=date.length===5?date:date.slice(5);date=now.getFullYear()+'-'+md;if(date<localDateStr(now))date=(now.getFullYear()+1)+'-'+md}const d=new Date(date+'T'+(time||'00:00').slice(0,5)+':00');return isNaN(d)?null:d};
DB.eventName=e=>e.title||e.titulo||e.nome||e.name||e.desc||'Compromisso';
DB.eventList=function(){return [...state.agenda.map(e=>({...e,birthday:false})),...state.aniversarios.map(e=>({...e,birthday:true}))]};
DB.agendaHTML=function(){const list=DB.eventList().map(e=>({...e,dt:DB.eventDate(e,e.birthday)})).filter(e=>e.dt).sort((a,b)=>a.dt-b.dt);return `<div class="card"><h3>Agenda e aniversários</h3><div class="db-actions"><button class="btn" onclick="DB.eventForm(false)">+ Compromisso</button><button class="btn gold" onclick="DB.eventForm(true)">+ Aniversário</button></div><p class="muted">Aviso na véspera e, quando houver horário, três horas antes. Resumo da manhã após as 5h.</p>${list.map(e=>`<div class="row"><span>${e.birthday?'🎂':'📅'} ${DB.esc(DB.eventName(e))}<br><small>${e.dt.toLocaleDateString('pt-BR')} ${DB.esc(e.time||e.hora||e.horario||'Dia inteiro')}</small></span><button class="btn outline small" onclick="DB.eventForm(${e.birthday},'${encodeURIComponent(e.id||'')}')">Editar</button></div>`).join('')||'<p>Nenhum evento cadastrado.</p>'}</div>`;};
DB.eventForm=function(birthday,id){const list=birthday?state.aniversarios:state.agenda;const e=list.find(x=>x.id===decodeURIComponent(id||''))||{};DB.editEvent={birthday,id:e.id};openSheet(birthday?'Aniversário':'Compromisso',`<form onsubmit="DB.saveEvent(event)"><label>Nome ou título<input class="db-field" id="ev-title" value="${DB.esc(DB.eventName(e)==='Compromisso'?'':DB.eventName(e))}" required></label><label>Data<input class="db-field" id="ev-date" type="date" value="${DB.esc(e.date||e.data||'')}" required></label><label>Horário (opcional)<input class="db-field" id="ev-time" type="time" value="${DB.esc(e.time||e.hora||'')}"></label><label>Observações<textarea class="db-field" id="ev-notes">${DB.esc(e.notes||e.observacoes||'')}</textarea></label><button class="btn block">Salvar</button></form>${e.id?'<button class="btn danger block" style="margin-top:10px" onclick="DB.deleteEvent()">Excluir</button>':''}`)};
DB.saveEvent=function(ev){ev.preventDefault();snapshot();const e=DB.editEvent,list=e.birthday?state.aniversarios:state.agenda;const old=list.find(x=>x.id===e.id);const data={...old,id:e.id||uid('ev'),title:document.getElementById('ev-title').value,date:document.getElementById('ev-date').value,time:document.getElementById('ev-time').value,notes:document.getElementById('ev-notes').value};if(old)Object.assign(old,data);else list.push(data);save();closeSheet();render();DB.checkReminders(false)};
DB.deleteEvent=function(){if(!confirm('Excluir este evento?'))return;snapshot();const e=DB.editEvent,key=e.birthday?'aniversarios':'agenda';state[key]=state[key].filter(x=>x.id!==e.id);save();closeSheet();render()};
DB.currentReminders=function(now=new Date()){const out=[];for(const e of DB.eventList()){const d=DB.eventDate(e,e.birthday,now);if(!d)continue;const diff=(d-now)/3600000;const t=localDateStr(now),tomorrow=localDateStr(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));const date=localDateStr(d);const title=DB.eventName(e);const hasTime=!!(e.time||e.hora||e.horario);if(date===tomorrow)out.push({key:(e.id||title)+':eve:'+t,text:`Amanhã: ${title}${hasTime?' às '+(e.time||e.hora||e.horario):''}.`});if(date===t){out.push({key:(e.id||title)+':day:'+t,text:`Hoje: ${title}${hasTime?' às '+(e.time||e.hora||e.horario):', dia inteiro'}.`,morning:true});if(hasTime&&diff>=0&&diff<=3)out.push({key:(e.id||title)+':3h:'+t,text:`${title} começa ${diff<1?'em menos de uma hora':'em aproximadamente '+Math.ceil(diff)+' horas'}.`});}}return out};
DB.checkReminders=function(onOpen=false){if(document.getElementById('app').style.display==='none')return;const now=new Date(),date=todayStr(),items=DB.currentReminders(now);DB.events=items;let box=document.getElementById('db-reminders');if(!box){box=document.createElement('section');box.id='db-reminders';document.getElementById('content').prepend(box)}box.innerHTML=items.length?`<div class="db-banner"><h3>Seus lembretes</h3>${[...new Set(items.map(x=>x.text))].map(t=>'<p>'+DB.esc(t)+'</p>').join('')}<button class="btn small" onclick="DB.speakReminders()">Ouvir lembretes</button></div>`:'';let seen;try{seen=JSON.parse(localStorage.getItem('dbReminderSeen')||'{}')}catch{seen={}}for(const item of items.filter(x=>!x.morning)){if(!seen[item.key]){if(state.dbSettings.notifications&&Notification.permission==='granted')navigator.serviceWorker?.ready.then(r=>r.showNotification('DB · Lembrete',{body:item.text})).catch(()=>{});seen[item.key]=true;}}localStorage.setItem('dbReminderSeen',JSON.stringify(Object.fromEntries(Object.entries(seen).filter(([k])=>k.endsWith(date)).slice(-100))));if(onOpen&&now.getHours()>=5&&localStorage.getItem('dbMorning')!==date){localStorage.setItem('dbMorning',date);DB.speakReminders(true)}};
DB.speakReminders=function(greeting=false){const texts=[...new Set(DB.events.map(e=>e.text))];DB.say((greeting?'Bom dia, Jhony. ':'')+(texts.length?texts.join(' '):'Você não tem lembretes para hoje ou amanhã.'))};
DB.allowNotifications=async()=>{if(!('Notification'in window))return toast('Este navegador não oferece notificações');const p=await Notification.requestPermission();state.dbSettings.notifications=p==='granted';save();toast(p==='granted'?'Ativadas enquanto o navegador permitir execução':'Notificações não autorizadas')};
DB.fetchJSON=async url=>{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}};
DB.fxUpdate=async()=>{try{const r=await DB.fetchJSON('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,BRL');if(!(r.rates?.BRL>0&&r.rates?.USD>0))throw Error();DB.fx={eur:r.rates.BRL,usd:r.rates.BRL/r.rates.USD,date:r.date,at:new Date().toISOString()};localStorage.setItem('dbFx',JSON.stringify(DB.fx));render();return DB.fx}catch(e){toast('Câmbio indisponível. Exibindo último dado salvo, se houver.');return null}};
DB.fxHTML=()=>`<div class="card"><h3>Dólar e euro em reais</h3>${DB.fx?`<div class="grid2"><div><span>US$ 1</span><b>${fmt(DB.fx.usd)}</b></div><div><span>€ 1</span><b>${fmt(DB.fx.eur)}</b></div></div><p class="muted">Taxa de referência · ${DB.esc(DB.fx.date)} · consultada em ${new Date(DB.fx.at).toLocaleString('pt-BR')}. Frankfurter. Não é cotação de turismo em tempo real.</p>`:'<p>Toque em atualizar para consultar as cotações.</p>'}<button class="btn outline" onclick="DB.fxUpdate()">Atualizar cotações</button></div>`;
DB.weatherCode=c=>c===0?'Céu limpo':c<=3?'Sol entre nuvens':c<=48?'Neblina':c>=95?'Trovoadas':c>=71&&c<=77?'Neve':'Chuva';
DB.weatherUpdate=async function(city,coordinates){try{let loc=coordinates;if(!loc){const g=await DB.fetchJSON('https://geocoding-api.open-meteo.com/v1/search?count=5&language=pt&name='+encodeURIComponent(city));if(!g.results?.length)throw Error('Cidade não encontrada');if(g.results.length>1){DB.locations=g.results;openSheet('Escolha a cidade',g.results.map((x,i)=>`<button class="btn outline block" style="margin:7px 0" onclick="DB.chooseCity(${i})">${DB.esc(x.name)}, ${DB.esc(x.admin1)}, ${DB.esc(x.country)}</button>`).join(''));return null}loc=g.results[0]}const w=await DB.fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);if(!w.daily?.time?.length)throw Error('Previsão vazia');DB.weather={...w,place:loc.name||'Minha localização',at:new Date().toISOString()};localStorage.setItem('dbWeather',JSON.stringify(DB.weather));render();return DB.weather}catch(e){toast(e.message||'Não foi possível consultar o tempo');return null}};
DB.chooseCity=i=>{const loc=DB.locations[i];closeSheet();return DB.weatherUpdate('',loc)};
DB.locate=function(){if(!navigator.geolocation)return toast('Localização não disponível');navigator.geolocation.getCurrentPosition(p=>DB.weatherUpdate('',{latitude:p.coords.latitude,longitude:p.coords.longitude,name:'Minha localização'}),()=>toast('Localização não autorizada. Digite sua cidade.'))};
DB.weatherHTML=function(){const w=DB.weather;return `<div class="card"><h3>Tempo do dia e da semana</h3><form class="db-actions" onsubmit="event.preventDefault();DB.weatherUpdate(this.elements.city.value)"><input name="city" aria-label="Cidade" class="f" placeholder="Digite a cidade" required><button class="btn">Buscar</button><button type="button" class="btn outline" onclick="DB.locate()">Minha localização</button></form>${w?`<h2>${DB.esc(w.place)} · ${Math.round(w.current.temperature_2m)}°C</h2><p>${DB.weatherCode(w.current.weather_code)}</p><div class="db-week">${w.daily.time.map((d,i)=>`<div class="db-day">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'})}<strong>${Math.round(w.daily.temperature_2m_max[i])}° / ${Math.round(w.daily.temperature_2m_min[i])}°</strong>${DB.weatherCode(w.daily.weather_code[i])}<br>Chuva: ${w.daily.precipitation_probability_max[i]??'—'}%</div>`).join('')}</div><p class="muted">Open-Meteo · consulta ${new Date(w.at).toLocaleString('pt-BR')} · fuso ${DB.esc(w.timezone)}. Dados salvos; atualize para obter nova previsão.</p>`:'<p>Escolha uma cidade para ver os próximos sete dias.</p>'}</div>`};
DB.trips=function(){const extra=state.viagem?(Array.isArray(state.viagem)?state.viagem:[state.viagem]):[];return [...extra,...state.dbTrips]};
DB.tripsHTML=function(){return `<div class="db-trip"><h2>Viagens</h2><p>Destinos, reservas e roteiro em um só lugar.</p><button class="btn" onclick="DB.tripForm()">+ Viagem</button></div>${DB.fxHTML()}${DB.trips().map((t,i)=>`<div class="card"><h3>${DB.esc(t.destination||t.destino||t.title||t.nome||'Viagem')}</h3><p>${DB.esc(t.start||t.inicio||t.dataInicio||'')} a ${DB.esc(t.end||t.fim||t.dataFim||'')}</p><p>Hotel: ${DB.esc(t.hotel||'Não informado')}</p><div style="white-space:pre-wrap">${DB.esc(typeof(t.itinerary||t.roteiro)==='string'?(t.itinerary||t.roteiro):JSON.stringify(t.itinerary||t.roteiro||'',null,2))}</div><div class="db-actions"><button class="btn outline" onclick="DB.tripMap(${i})">Abrir mapa</button>${state.dbTrips.includes(t)?`<button class="btn outline" onclick="DB.tripForm('${encodeURIComponent(t.id)}')">Editar</button>`:''}</div></div>`).join('')||'<div class="card">Nenhuma viagem cadastrada.</div>'}`};
DB.tripMap=i=>{const t=DB.trips()[i],q=t.destination||t.destino||t.title;if(!q)return toast('Cadastre o destino');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener')};
DB.tripForm=function(id){const t=state.dbTrips.find(x=>x.id===decodeURIComponent(id||''))||{};DB.tripEditing=t.id;openSheet('Viagem',`<form onsubmit="DB.saveTrip(event)"><label>Destino<input class="db-field" id="tr-dest" required value="${DB.esc(t.destination)}"></label><label>Ida<input class="db-field" type="date" id="tr-start" required value="${DB.esc(t.start)}"></label><label>Volta<input class="db-field" type="date" id="tr-end" required value="${DB.esc(t.end)}"></label><label>Hotel<input class="db-field" id="tr-hotel" value="${DB.esc(t.hotel)}"></label><label>Roteiro por dia / reservas<textarea class="db-field" rows="8" id="tr-plan">${DB.esc(t.itinerary)}</textarea></label><button class="btn block">Salvar</button></form>`)};
DB.saveTrip=function(e){e.preventDefault();const start=document.getElementById('tr-start').value,end=document.getElementById('tr-end').value;if(end<start)return toast('Volta anterior à ida');snapshot();const t={id:DB.tripEditing||uid('trip'),destination:document.getElementById('tr-dest').value,start,end,hotel:document.getElementById('tr-hotel').value,itinerary:document.getElementById('tr-plan').value};const old=state.dbTrips.find(x=>x.id===t.id);if(old)Object.assign(old,t);else state.dbTrips.push(t);save();closeSheet();render()};
DB.contactsHTML=function(){return `<div class="card"><h3>Contatos da DIdI</h3><p>Selecione no Android os contatos que deseja salvar neste navegador. O site não pode pesquisar a agenda inteira sem essa seleção.</p><div class="db-actions"><button class="btn" onclick="DB.pickContacts()">Selecionar no celular</button><button class="btn outline" onclick="DB.contactForm()">Adicionar manualmente</button></div>${state.contatos.map((c,i)=>`<div class="row"><span>${DB.esc(c.name||c.nome)}</span><button class="btn small" onclick="DB.chooseContact(${i})">Falar com contato</button></div>`).join('')}</div>`};
DB.addContacts=function(items){snapshot();items.forEach(c=>{const name=Array.isArray(c.name)?c.name[0]:c.name;const phones=(Array.isArray(c.tel)?c.tel:[c.phone||c.telefone||c.tel]).filter(Boolean);for(const phone of phones)if(!state.contatos.some(x=>(x.name||x.nome)===name&&(x.phone||x.telefone)===phone))state.contatos.push({id:uid('ct'),name,phone})});save();render()};
DB.pickContacts=async()=>{if(!navigator.contacts?.select)return toast('Seletor indisponível. Adicione manualmente.');try{DB.addContacts(await navigator.contacts.select(['name','tel'],{multiple:true}))}catch(e){if(e.name!=='AbortError')toast('Não foi possível acessar o seletor')}};
DB.contactForm=()=>openSheet('Adicionar contato','<form onsubmit="event.preventDefault();DB.addContacts([{name:this.elements.name.value,phone:this.elements.phone.value}]);closeSheet()"><label>Nome<input class="db-field" name="name" required></label><label>Telefone com código do país (ex.: +55...)<input class="db-field" name="phone" type="tel" required></label><button class="btn block">Salvar</button></form>');
DB.chooseContact=i=>{DB.flow={stage:'method',contact:state.contatos[i]};DB.openVoice(false);DB.say('Jhony, encontrei '+(state.contatos[i].name||state.contatos[i].nome)+'. Quer mensagem no WhatsApp, vídeo no WhatsApp ou ligação normal?');DB.contactOptions()};
DB.contactOptions=function(){const box=document.getElementById('didiBody'),div=document.createElement('div');div.className='didiQuick';[['WhatsApp','whatsapp'],['WhatsApp vídeo','video'],['Ligação normal','normal']].forEach(([label,m])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>DB.launchContact(m);div.append(b)});box.append(div)};
DB.launchContact=function(method){const c=DB.flow?.contact;if(!c)return;const raw=String(c.phone||c.telefone||c.tel||'');const phone=raw.replace(/[^\d+]/g,'');if(!/^\+?\d{8,15}$/.test(phone)){DB.flow=null;return DB.say('O telefone não está válido. Cadastre com código do país.')}if(method!=='normal'&&!phone.startsWith('+'))return DB.say('Para WhatsApp, salve o telefone com o código do país, começando por mais.');const url=method==='normal'?'tel:'+phone:'https://wa.me/'+phone.replace(/\D/g,'');DB.stopVoice();DB.flow=null;DB.say(method==='normal'?'Vou tentar abrir o discador para '+(c.name||c.nome)+'.':'Vou abrir a conversa no WhatsApp. '+(method==='video'?'Toque no ícone de vídeo dentro do WhatsApp.':'Você pode escrever ou enviar uma mensagem de voz por lá.'));const a=document.createElement('a');a.className='db-link';a.href=url;a.rel='noopener';a.textContent='Abrir '+(method==='normal'?'discador':'WhatsApp')+' · '+(c.name||c.nome);document.getElementById('didiBody').append(a);window.location.href=url;};
const extraNav=[['agenda','Agenda e aniversários','📅'],['viagens','Viagens','✈'],['tempo','Tempo da semana','☀'],['contatos','Contatos','☎'],['config','Configurações','⚙']];extraNav.forEach(([id,label,ic])=>NAV.push({id,label,ic}));
const baseRender=render;
render=function(){DB.normalize();const custom={agenda:DB.agendaHTML,viagens:DB.tripsHTML,tempo:DB.weatherHTML,contatos:DB.contactsHTML,config:DB.settings};if(custom[currentTab]){buildNav();document.getElementById('headerSub').textContent=NAV.find(n=>n.id===currentTab)?.label||'DB';document.getElementById('content').innerHTML=custom[currentTab]();document.getElementById('fabBtn').style.display='none'}else baseRender();if(['relatorios','fechamento'].includes(currentTab))document.getElementById('content').insertAdjacentHTML('afterbegin',DB.chartHTML());DB.privacy();DB.theme();DB.checkReminders(false)};
const baseImport=importBackup;importBackup=function(e){baseImport(e)};
const originalUnlock=tryUnlock;tryUnlock=function(){originalUnlock();if(document.getElementById('app').style.display==='flex'){DB.checkReminders(true)}};
const oldLock=lockApp;lockApp=function(){DB.stopVoice?.();document.getElementById('didiPanel')?.classList.remove('open');oldLock()};
DB.boot=function(){document.title='DB · Meu assistente';document.getElementById('lockTitle').textContent='DB · Meu assistente';document.querySelector('header.top .title b').textContent='DB · Meu assistente';document.querySelector('.lockLogo').textContent='DB';const eye=document.createElement('button');eye.id='db-eye';eye.className='lockBtn';eye.onclick=DB.toggleMoney;document.querySelector('header.top').insertBefore(eye,document.querySelector('header.top .lockBtn'));document.querySelector('.drawerFoot').insertAdjacentHTML('afterbegin',`<button class="drawerAction" onclick="undoLast()">↶ Desfazer</button><button class="drawerAction" onclick="DB.undoHistory()">Histórico de desfazer</button><button class="drawerAction" onclick="DB.csv()">Exportar CSV</button><button class="drawerAction" onclick="DB.shareBackup()">Compartilhar backup</button>`);const bar=document.createElement('nav');bar.className='db-bottom';bar.setAttribute('aria-label','Navegação principal');bar.innerHTML=`<button onclick="goTab('situacao')">Início</button><button onclick="goTab('lancamentos')">Finanças</button><button class="robot" onclick="DB.openVoice(true)">🤖 DIdI</button><button onclick="goTab('agenda')">Agenda</button><button onclick="toggleDrawer(true)">☰ Mais</button>`;document.getElementById('app').append(bar);const talk=document.createElement('button');talk.className='db-talk';talk.textContent='🤖 Fale com a DIdI';talk.onclick=()=>DB.openVoice(true);document.getElementById('app').append(talk);for(const [key,name] of [['dbWeather','weather'],['dbFx','fx']])try{DB[name]=JSON.parse(localStorage.getItem(key)||'null')}catch{}DB.privacy();DB.theme();setInterval(()=>{if(!document.hidden)DB.checkReminders(true)},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)DB.checkReminders(true)});};
DB.norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,!?]/g,'').trim();
DB.stopVoice=function(){DB.voice=false;clearTimeout(DB.listenTimer);try{DB.rec?.abort()}catch{}DB.voiceStatus('Microfone desligado')};
DB.voiceStatus=t=>{const el=document.getElementById('db-voice-status');if(el)el.textContent=t};
DB.listen=function(){if(!DB.voice||document.hidden||document.getElementById('app').style.display==='none')return;try{DB.rec.start()}catch(e){DB.voiceStatus('Toque no microfone para retomar.')}};
DB.say=function(message){const box=document.getElementById('didiBody');if(box){const d=document.createElement('div');d.className='didiMsg didiBot';d.textContent=message;box.append(d);DB.maskMessage(d);box.scrollTop=box.scrollHeight}DB.lastSpoken=message;if(!state.dbSettings.voice||!window.speechSynthesis){if(DB.voice)DB.listenTimer=setTimeout(DB.listen,400);return}DB.speaking=true;try{DB.rec?.abort()}catch{}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='pt-BR';let finished=false;const done=()=>{if(finished)return;finished=true;DB.speaking=false;if(DB.voice)DB.listenTimer=setTimeout(DB.listen,400)};u.onend=done;u.onerror=()=>{done();DB.voiceStatus('Áudio bloqueado ou indisponível. Use Ouvir resposta.')};window.speechSynthesis.speak(u);};
DB.openVoice=function(listen=false){if(document.getElementById('app').style.display==='none')return;document.getElementById('didiPanel').classList.add('open');if(listen){if(!DB.rec)return DB.say('Seu navegador não oferece reconhecimento de voz. Digite sua pergunta.');DB.voice=true;DB.listen()}else DB.voiceStatus('Digite ou toque no microfone para falar')};
DB.parseMonth=function(text){const t=DB.norm(text),now=new Date();const months=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];const idx=months.findIndex(m=>new RegExp('\\b'+m+'\\b').test(t)),year=t.match(/\b20\d{2}\b/);if(idx>=0)return (year?year[0]:now.getFullYear())+'-'+String(idx+1).padStart(2,'0');const numeric=t.match(/\b(0?[1-9]|1[0-2])\/(20\d{2})\b/);if(numeric)return numeric[2]+'-'+numeric[1].padStart(2,'0');if(/passado|anterior/.test(t))now.setMonth(now.getMonth()-1);else if(/proximo|seguinte/.test(t))now.setMonth(now.getMonth()+1);return localDateStr(now).slice(0,7)};
DB.addVoiceUser=function(text){const div=document.createElement('div');div.className='didiMsg didiUser';div.textContent=text;document.getElementById('didiBody').append(div);DB.maskMessage(div)};
DB.handle=async function(text){const t=DB.norm(text).replace(/^didi\s*/,'');if(!t)return;if(/^(cancelar|cancele|parar|pare|chega)$/.test(t)){DB.flow=null;DB.stopVoice();DB.say('Certo, Jhony. Cancelei.');return true}
if(DB.flow?.stage==='duplicate'){const opts=DB.flow.contacts;const ord={'primeiro':0,'primeira':0,'segundo':1,'segunda':1,'terceiro':2,'terceira':2};let i=ord[t];if(i===undefined&&/^\d+$/.test(t))i=Number(t)-1;let matches=opts.filter(c=>DB.norm(c.name||c.nome)===t);const c=i!==undefined?opts[i]:(matches.length===1?matches[0]:null);if(!c){DB.say('Diga o número da opção ou o nome completo.');return true}DB.flow={stage:'method',contact:c};DB.say('Quer WhatsApp, vídeo no WhatsApp ou ligação normal?');DB.contactOptions();return true}
if(DB.flow?.stage==='method'){if(/video/.test(t))DB.launchContact('video');else if(/whats|mensagem|zap/.test(t))DB.launchContact('whatsapp');else if(/normal|telefone|convencional|ligacao/.test(t))DB.launchContact('normal');else DB.say('Escolha WhatsApp, vídeo no WhatsApp ou ligação normal.');return true}
if(DB.flow?.stage==='weather-city'){DB.flow=null;const w=await DB.weatherUpdate(text);if(w)DB.say(DB.weatherSpeech());return true}
if(DB.flow?.stage==='event-title'){DB.flow.title=text;DB.flow.stage='event-date';DB.say('Qual a data? Diga, por exemplo, 15 de novembro de 2026.');return true}
if(DB.flow?.stage==='event-date'){const date=DB.parseDate(text);if(!date){DB.say('Não reconheci a data. Diga dia, mês e ano.');return true}DB.flow.date=date;DB.flow.stage='event-time';DB.say('Qual o horário? Diga, por exemplo, 15 horas, ou dia inteiro.');return true}
if(DB.flow?.stage==='event-time'){const match=t.match(/\b([01]?\d|2[0-3])(?:\s*(?::|h|horas?)\s*([0-5]\d)?)?\b/);if(!match&&!/inteiro|sem horario/.test(t)){DB.say('Diga o horário ou dia inteiro.');return true}DB.flow.time=match?match[1].padStart(2,'0')+':'+(match[2]||'00'):'';DB.flow.stage='event-confirm';DB.say(`Vou cadastrar ${DB.flow.title} em ${fmtDate(DB.flow.date)} ${DB.flow.time||'dia inteiro'}. Confirmar?`);return true}
if(DB.flow?.stage==='event-confirm'){if(/^(sim|confirmo|confirmar|pode|pode salvar|salvar)$/.test(t)){snapshot();const f=DB.flow;state[f.birthday?'aniversarios':'agenda'].push({id:uid('ev'),title:f.title,date:f.date,time:f.time});DB.flow=null;save();render();DB.say('Salvei, Jhony. Os lembretes estão configurados.')}else DB.say('Diga sim para salvar ou cancelar.');return true}
const call=t.match(/(?:ligue|ligar|chame|chamar|telefone)(?:\s+(?:para|pra|a|o))?\s+(.+)/);if(call){const name=call[1].replace(/^(a|o)\s+/,'');const exact=state.contatos.filter(c=>DB.norm(c.name||c.nome)===name);const found=exact.length?exact:state.contatos.filter(c=>DB.norm(c.name||c.nome).split(/\s+/).includes(name)||DB.norm(c.name||c.nome).startsWith(name+' '));if(!found.length){DB.say('Jhony, não encontrei esse nome nos contatos salvos. Abra Contatos e selecione as pessoas da sua agenda, ou adicione manualmente.');return true}if(found.length>1){DB.flow={stage:'duplicate',contacts:found};DB.say('Encontrei mais de um contato. '+found.map((c,i)=>`${i+1}: ${c.name||c.nome}, telefone terminado em ${String(c.phone||c.telefone||'').slice(-4)}`).join('. ')+'. Qual opção?');}else{DB.flow={stage:'method',contact:found[0]};DB.say('Jhony, encontrei '+(found[0].name||found[0].nome)+'. Quer WhatsApp, vídeo no WhatsApp ou ligação normal?');DB.contactOptions()}return true}
if(/(?:cadastrar|adicionar|criar|marcar|agendar).*(?:compromisso|evento|aniversario|consulta)/.test(t)){DB.flow={stage:'event-title',birthday:/aniversario/.test(t)};DB.say('Qual o nome ou título?');return true}
if(/pagamentos|previsao.*pagar|contas.*(?:mes|pagar)|paguei|pagar.*mes/.test(t)){const month=DB.parseMonth(t),p=DB.payments(month);DB.month=month;goTab('previsao');DB.say('Jhony, em '+DB.monthLabel(month)+': pagamentos realizados de '+DB.rawMoney(p.paidTotal)+' e compromissos em aberto de '+DB.rawMoney(p.pendingTotal)+'. '+(p.pending.length?p.pending.slice(0,8).map(x=>x.desc+', '+DB.rawMoney(x.amount)).join('; '):'Não há pendências registradas nesse mês.')+' Valores pagos incluem somente lançamentos realizados.');return true}
if(/dolar|euro|cotacao|cambio/.test(t)){const r=await DB.fxUpdate();if(r)DB.say(`Jhony, um dólar corresponde a ${DB.rawMoney(r.usd)} e um euro a ${DB.rawMoney(r.eur)}. Taxa de referência de ${r.date}.`);else DB.say('Não consegui atualizar as cotações. Tente novamente mais tarde.');return true}
if(/tempo|clima|chover|chuva|temperatura/.test(t)){goTab('tempo');const city=t.match(/(?:tempo|clima|temperatura|chover|chuva).*?\b(?:em|para)\s+(.+)/)?.[1];if(city){const w=await DB.weatherUpdate(city);if(w)DB.say(DB.weatherSpeech())}else if(DB.weather)DB.say(DB.weatherSpeech());else{DB.flow={stage:'weather-city'};DB.say('De qual cidade você quer a previsão?')}return true}
if(/aniversario|agenda|compromissos|lembretes/.test(t)){goTab('agenda');const e=DB.eventList().map(x=>({...x,dt:DB.eventDate(x,x.birthday)})).filter(x=>x.dt&&localDateStr(x.dt)>=todayStr()).sort((a,b)=>a.dt-b.dt);DB.say(e.length?'Jhony, seus próximos eventos: '+e.slice(0,8).map(x=>DB.eventName(x)+', '+x.dt.toLocaleDateString('pt-BR')+' '+(x.time||x.hora||'dia inteiro')).join('; '):'Jhony, você não tem eventos futuros cadastrados.');return true}
if(/cartao|cartoes|fatura|vencimento|fechamento/.test(t)&&!/mensal/.test(t)){goTab('cartoes');const match=state.cards.filter(c=>t.includes(DB.norm(c.name)));const cards=match.length?match:state.cards;DB.say('Jhony, '+cards.map(c=>`${c.name}: vencimento dia ${c.dueDay||'não informado'}, fechamento ${c.closingDay?'dia '+c.closingDay:'não informado'}, melhor dia ${c.bestDay||'não informado'}, limite ${DB.rawMoney(c.limit)}.`).join(' '));return true}
if(/viagem|viagens|roteiro/.test(t)){goTab('viagens');const ts=DB.trips();DB.say(ts.length?'Jhony, '+ts.map(x=>(x.destination||x.destino||x.nome||'Viagem')+', '+(x.start||x.inicio||'')+'. '+(typeof(x.itinerary||x.roteiro)==='string'?(x.itinerary||x.roteiro):'Veja o roteiro na tela.')).join(' '):'Jhony, não há viagens cadastradas. Use Adicionar viagem para registrar destino, datas e roteiro.');return true}
if(/caixinha|reservado/.test(t)){goTab('caixinhas');DB.say('Jhony, o total em caixinhas é '+DB.rawMoney(caixinhasTotal())+'. '+state.boxes.map(x=>x.name+': '+DB.rawMoney(x.balance)).join('. '));return true}
if(/emprestimo|divida/.test(t)){goTab('emprestimo');DB.say('Jhony, empréstimo restante de '+DB.rawMoney(loanRemaining())+' e dívidas em aberto de '+DB.rawMoney(dividasTotal())+'.');return true}
if(/historico.*desfazer/.test(t)){DB.undoHistory();DB.say('Jhony, abri os pontos de restauração. Escolha o ponto na tela.');return true}
if(/ocultar valores|esconder valores|mostrar valores/.test(t)){DB.hidden=!/mostrar/.test(t);localStorage.setItem('dbHide',DB.hidden?'1':'0');DB.privacy();DB.say(DB.hidden?'Valores ocultos.':'Valores visíveis.');return true}

DB.installmentAmount=function(total,count,number){const cents=Math.round(Number(total)*100);return (Math.floor(cents/count)+(number<=cents%count?1:0))/100};
DB.cardPurchases=function(cardId,month){return activeLanc().filter(l=>l.type==='saida'&&l.cardId===cardId&&(!month||String(l.date).startsWith(month)))};
DB.cardPurchasesHTML=function(card){const groups={};for(const l of DB.cardPurchases(card.id)){const month=String(l.date).slice(0,7);if(!/^\d{4}-\d{2}$/.test(month))continue;(groups[month]??=[]).push(l)}const months=Object.keys(groups).sort();return '<div class="db-card-purchases"><h3>Faturas das compras</h3><p class="muted">A compra utiliza o limite do cartão. O saldo da conta só diminui quando você confirma o pagamento.</p>'+months.map(month=>{const items=groups[month],pending=items.filter(l=>!l.applied),paid=items.filter(l=>l.applied),total=items.reduce((s,l)=>s+Number(l.amount||0),0),open=pending.reduce((s,l)=>s+Number(l.amount||0),0);return '<details class="db-invoice-month" '+(open>0?'open':'')+'><summary><strong>'+DB.esc(DB.monthLabel(month))+'</strong><span>'+DB.esc(DB.rawMoney(open))+' em aberto</span></summary><div class="row"><span>Total das compras</span><b>'+DB.esc(DB.rawMoney(total))+'</b></div><div class="row"><span>Pago</span><b>'+DB.esc(DB.rawMoney(paid.reduce((s,l)=>s+Number(l.amount||0),0)))+'</b></div><ul class="db-pay-list">'+items.map(l=>'<li><div><span class="db-pay-title">'+DB.esc(l.desc)+'</span><small>Vencimento: '+DB.esc(fmtDate(l.date))+(l.installments>1?' · Parcela '+l.installmentNum+'/'+l.installments:'')+'</small><span class="db-pay-status">'+(l.applied?'Pago':'Na fatura')+'</span></div><span class="db-pay-amount">'+DB.esc(DB.rawMoney(l.amount))+'</span></li>').join('')+'</ul>'+(pending.length?'<button class="btn small block" style="margin-top:12px" data-card="'+DB.esc(card.id)+'" data-month="'+month+'" onclick="DB.payCardPurchases(this.dataset.card,this.dataset.month)">Confirmar pagamento dessas compras</button>':'')+'</details>'}).join('')+(months.length?'':'<p class="muted">Nenhuma compra registrada neste cartão.</p>')+'</div>'};
DB.payCardPurchases=async function(cardId,month){const card=cardById(cardId);if(!card)return;const pending=DB.cardPurchases(cardId,month).filter(l=>!l.applied),total=DB.roundMoney(pending.reduce((s,l)=>s+Number(l.amount||0),0));if(!pending.length||total<=0)return toast('Essas compras já estão pagas.');if(!confirm('Você já pagou '+DB.rawMoney(total)+' dessas compras de '+card.name+', fatura de '+DB.monthLabel(month)+'? Confirmar descontará esse valor do saldo da conta.'))return;snapshot();pending.forEach(l=>applyLancEffect(l));logHist('Pagamento confirmado das compras de '+card.name+' · '+month+' · '+DB.rawMoney(total));save();await DBStore.flush();render();toast('Pagamento registrado. Saldo e limite atualizados.')};
const beforeCreditForm=openLancForm;
openLancForm=function(id,...rest){beforeCreditForm(id,...rest);const card=document.getElementById('f_card'),status=document.getElementById('f_status');if(!card||!status)return;DB.creditEditingId=id||null;DB.creditCashStatus=status.value;DB.creditFormUpdate=function(){const existing=DB.creditEditingId?state.lancamentos.find(l=>l.id===DB.creditEditingId):null,type=document.getElementById('f_type_es').value,selected=type==='saida'&&card.value?cardById(card.value):null;let note=document.getElementById('db-credit-note');if(!note){note=document.createElement('p');note.id='db-credit-note';note.className='db-credit-note';card.after(note)}const unpaid=!!selected&&!existing?.applied;status.disabled=unpaid;status.querySelector('[value="previsto"]').textContent=selected?'Na fatura (não paga)':'Previsto';if(unpaid)status.value='previsto';if(!selected&&DB.creditSelectedBefore)status.value=DB.creditCashStatus;DB.creditSelectedBefore=!!selected;const date=document.getElementById('f_date').value;if(selected){const due=date?computeCardDueDate(date,selected):null;note.textContent=existing?.applied?'Este lançamento já foi pago. Alterar ou estornar pode ajustar o saldo da conta.':'Compra em '+selected.name+(due?' · primeira cobrança em '+fmtDate(due):'')+'. O valor entra na fatura e utiliza o limite; não sai do saldo da conta ao salvar.'}else note.textContent='Sem cartão selecionado: uma saída realizada será descontada do saldo da conta.';const preview=document.getElementById('parcPreview');if(selected&&preview&&document.getElementById('f_ptype').value==='parcelado'){const total=DB.parseAmount(document.getElementById('f_amount').value)||0,n=Math.max(2,Number(document.getElementById('f_installments').value)||2);preview.textContent=n+' parcelas, total de '+DB.rawMoney(total)+', na fatura de '+selected.name+'. Nenhuma parcela é paga automaticamente.'}};for(const id of ['f_card','f_type_es','f_date','f_amount','f_ptype','f_installments'])for(const event of ['change','input'])document.getElementById(id)?.addEventListener(event,DB.creditFormUpdate);DB.creditFormUpdate()};
const beforeSaveCredit=saveLanc;
saveLanc=function(id){const type=document.getElementById('f_type_es')?.value,cardId=document.getElementById('f_card')?.value,old=id?state.lancamentos.find(l=>l.id===id):null;if(type==='saida'&&cardId){if(!cardById(cardId))return toast('Selecione um cartão válido.');if(!old?.applied)document.getElementById('f_status').value='previsto'}return beforeSaveCredit(id)};
const receiptBeforeCredit=DB.salaryReceipt;DB.salaryReceipt=function(l){if(l.type==='saida'&&l.cardId&&!l.applied){const card=cardById(l.cardId);return 'Jhony, compra de '+DB.rawMoney(l.amount)+' registrada na fatura de '+(card?.name||'seu cartão')+', vencimento '+fmtDate(l.date)+'. O saldo da conta não foi alterado.'}return receiptBeforeCredit(l)};
const beforeCreditVoice=DB.handle;
DB.handle=async function(text){const t=DB.norm(text);let card=null;if(!DB.flow&&/\b(?:gastei|comprei|paguei|registrar|lancar|anotar)\b/.test(t)&&/\d/.test(t)&&!/\b(?:fatura|quitar|quitei)\b/.test(t)){const matches=state.cards.filter(c=>{const name=DB.norm(c.name||'');return t.includes(name)||name.split(/\s+/).some(w=>w.length>=4&&!['cartao','credito','dione','debito'].includes(w)&&new RegExp('\\b'+w+'\\b').test(t))});if(matches.length===1)card=matches[0]}const handled=await beforeCreditVoice(text);if(card&&DB.flow&&['financial-category','financial-confirm'].includes(DB.flow.stage)&&DB.flow.type==='saida'){DB.flow.cardId=card.id;DB.say('Essa compra será registrada na fatura de '+card.name+', sem desconto no saldo agora. '+(DB.flow.stage==='financial-confirm'?'Diga sim para confirmar ou cancelar.':'De qual categoria?'))}return handled};
const beforeInvoicePayment=savePayment;
savePayment=function(cardId,invoiceId){const inv=cardById(cardId)?.invoices?.find(i=>i.id===invoiceId);if(!inv)return;const remaining=DB.roundMoney(Math.max(0,Number(inv.amount||0)-Number(inv.paidAmount||0))),amount=DB.parseAmount(document.getElementById('f_amount').value)||0;if(remaining<=0)return toast('Essa fatura já está paga.');if(amount>remaining)return toast('O pagamento não pode ultrapassar o restante da fatura.');return beforeInvoicePayment(cardId,invoiceId)};
const style=document.createElement('style');style.textContent='.db-credit-note{font-size:13px;line-height:1.5;padding:12px;background:var(--gold-soft);color:var(--ink);border-radius:10px}.db-invoice-month{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}.db-invoice-month summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:13px;flex-wrap:wrap}.db-invoice-month summary span{color:var(--ink-soft)}';document.head.append(style);
})();

</script>
<script>
(function(){
DB.weatherRequest=null;
DB.weatherSelection=function(text,now=new Date()){
 const t=DB.norm(text),base=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);let date=null;
 if(/\bsemana\b|proximos (?:sete|7) dias/.test(t))return {date:null};
 if(/depois de amanha/.test(t)){base.setDate(base.getDate()+2);date=base}
 else if(/\bamanha\b/.test(t)){base.setDate(base.getDate()+1);date=base}
 else if(/\bhoje\b/.test(t))date=base;
 else {const m=t.match(/\b(?:dia\s+)?(\d{1,2})(?:\s*(?:\/|de)\s*(\d{1,2}|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s*(?:\/|de)\s*(\d{4}))?)?\b/);
 if(m){const names=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];let month=m[2]?(isNaN(Number(m[2]))?names.indexOf(m[2]):Number(m[2])-1):base.getMonth();date=new Date(m[3]?+m[3]:base.getFullYear(),month,+m[1],12);if(!m[2]&&date<base)date.setMonth(date.getMonth()+1);if(date.getDate()!==+m[1])return {date:'invalid'}}
 else {const days=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];const day=days.findIndex(x=>new RegExp('\\b'+x+'(?:-feira)?\\b').test(t));if(day>=0){let delta=(day-base.getDay()+7)%7;if(!delta&&/proxim/.test(t))delta=7;base.setDate(base.getDate()+delta);date=base}}
 }
 return {date:date?date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'):null};
};
DB.weatherDayIndex=()=>DB.weather?.daily?.time.indexOf(DB.weatherRequest?.date)??-1;
const weekHTML=DB.weatherHTML,weekSpeech=DB.weatherSpeech;
DB.weatherHTML=function(){if(!DB.weatherRequest?.date)return weekHTML();const w=DB.weather,i=DB.weatherDayIndex();if(!w)return weekHTML();if(i<0)return '<div class="card"><h3>Previsão do tempo</h3><p>Não há previsão disponível para a data solicitada. A consulta cobre os próximos sete dias.</p></div>';const day=new Date(w.daily.time[i]+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});return `<div class="card db-weather-single"><h3>Previsão do tempo</h3><p class="muted">${DB.esc(w.place)}</p><h2>${DB.esc(day)}</h2><p>${DB.esc(DB.weatherCode(w.daily.weather_code[i]))}</p><div class="db-weather-metrics"><div><small>Mínima</small><strong>${Math.round(w.daily.temperature_2m_min[i])} °C</strong></div><div><small>Máxima</small><strong>${Math.round(w.daily.temperature_2m_max[i])} °C</strong></div><div><small>Chance de chuva</small><strong>${w.daily.precipitation_probability_max[i]??'—'}%</strong></div></div><p class="muted">Open-Meteo · atualizado em ${new Date(w.at).toLocaleString('pt-BR')}</p><button class="btn outline" onclick="DB.weatherRequest=null;render()">Ver semana</button></div>`};
DB.weatherSpeech=function(){if(!DB.weatherRequest?.date)return weekSpeech();const w=DB.weather,i=DB.weatherDayIndex();if(!w||i<0)return 'Jhony, não há previsão disponível para essa data. A consulta cobre os próximos sete dias.';return 'Jhony, em '+w.place+', '+new Date(w.daily.time[i]+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+': '+DB.weatherCode(w.daily.weather_code[i])+', mínima de '+Math.round(w.daily.temperature_2m_min[i])+' e máxima de '+Math.round(w.daily.temperature_2m_max[i])+' graus. Chance de chuva de '+(w.daily.precipitation_probability_max[i]??'não informada')+' por cento.'};
const oldHandle=DB.handle;
DB.handle=async function(text){const t=DB.norm(text);if(/\btempo\b|\bclima\b|\btemperatura\b|\bchover\b|\bchuva\b/.test(t)){
 DB.weatherRequest=DB.weatherSelection(text);DB.flow=null;DB.paymentReading=null;window.__didiPending=null;
 let city=String(text).match(/\b(?:em|para)\s+(?!(?:hoje|amanh[ãa]|o dia|dia|a semana|segunda|ter[cç]a|quarta|quinta|sexta|s[áa]bado|domingo)\b)(.+)/i)?.[1]?.replace(/\s+(?:para|no dia|dia|hoje|amanh[ãa]|depois de|na |nesta |neste |segunda|ter[cç]a|quarta|quinta|sexta|s[áa]bado|domingo|durante|essa semana|esta semana).*$/i,'').replace(/[.!?]+$/,'').trim();
 goTab('tempo');if(city){const w=await DB.weatherUpdate(city);if(w)DB.say(DB.weatherSpeech())}
 else if(DB.weather){const loc=DB.weather;const w=await DB.weatherUpdate('',{latitude:loc.latitude,longitude:loc.longitude,name:loc.place});if(w)DB.say(DB.weatherSpeech())}
 else {DB.flow={stage:'weather-city'};DB.say('De qual cidade você quer a previsão do tempo, Jhony?')}return true;
 }return oldHandle(text)};
const choose=DB.chooseCity;DB.chooseCity=async function(i){const w=await choose(i);if(w)DB.say(DB.weatherSpeech());return w};
})();
