<style>
:root{
  --bg:#F3F1EA; --panel:#FFFFFF; --ink:#132C2A; --ink-soft:#5B6C69;
  --teal:#0F3D3E; --teal-dark:#0A2B2C; --gold:#C9973A; --gold-soft:#EFE1C4;
  --green:#2E7D5B; --green-soft:#E4F1EA; --red:#B23A2E; --red-soft:#F8E4E1;
  --line:#E4E0D3; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;}
h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* LOCK SCREEN */
#lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--teal) 0%,var(--teal-dark) 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;}
.lockCard{background:var(--panel);border-radius:20px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.lockLogo{width:64px;height:64px;border-radius:16px;background:var(--teal);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 16px;}
.lockCard h1{font-size:20px;margin:0 0 4px;}
.lockCard p{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.lockCard input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:22px;text-align:center;letter-spacing:6px;margin-bottom:12px;}
.lockCard button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--teal);color:#fff;font-weight:600;font-size:15px;}
.lockErr{color:var(--red);font-size:12px;height:16px;margin-bottom:4px;}
.lockHint{margin-top:14px;font-size:11px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}

/* APP SHELL */
#app{display:none;height:100%;flex-direction:column;}
header.top{background:var(--teal);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
header.top .menuBtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
header.top .title{flex:1;}
header.top .title b{font-size:15px;display:block;}
header.top .title span{font-size:11px;opacity:.75;}
header.top .lockBtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:16px;}

#drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--teal-dark);color:#fff;z-index:200;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding-bottom:20px;}
#drawer.open{transform:translateX(0);}
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;}
#drawerOverlay.show{display:block;}
.drawerHead{padding:20px 18px 12px;border-bottom:1px solid rgba(255,255,255,.1);}
.drawerHead b{font-size:15px;}
.navItem{display:flex;align-items:center;gap:10px;padding:13px 18px;font-size:14px;color:rgba(255,255,255,.85);border-left:3px solid transparent;}
.navItem.active{background:rgba(255,255,255,.08);border-left-color:var(--gold);color:#fff;font-weight:600;}
.navItem .ic{width:20px;text-align:center;}
.drawerFoot{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding:14px 18px 4px;display:flex;flex-direction:column;gap:8px;}
.drawerAction{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;text-align:left;}

main{flex:1;overflow-y:auto;padding:14px 14px 80px;}
.card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.card h3{margin:0 0 10px;font-size:14px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.row:last-child{border-bottom:none;}
.big{font-size:26px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-soft);color:var(--green);}
.pill.red{background:var(--red-soft);color:var(--red);}
.expenseRow{border-bottom:1px solid var(--line);padding:12px 0;}
.expenseRow:last-child{border-bottom:none;}
.expenseTop{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;margin-bottom:6px;}
.expenseMeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.expenseActions{display:flex;gap:8px;flex-wrap:wrap;}
.pill.gold{background:var(--gold-soft);color:#8a6412;}
.pill.grey{background:#EEE;color:#777;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:11px;border:none;background:var(--teal);color:#fff;font-weight:600;font-size:13.5px;}
.btn.gold{background:var(--gold);color:#3a2b06;}
.btn.outline{background:transparent;border:1.4px solid var(--teal);color:var(--teal);}
.btn.small{padding:7px 10px;font-size:12.5px;}
.btn.danger{background:var(--red);}
.btn.block{width:100%;}
.fab{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#3a2b06;border:none;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:60;}
label.f{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;font-weight:600;}
input.f,select.f,textarea.f{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;}
.formSheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.formSheet.show{display:flex;}
.sheetBody{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 18px 24px;}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sheetHead h3{margin:0;font-size:16px;}
.sheetHead .x{background:none;border:none;font-size:20px;color:var(--ink-soft);}
.muted{color:var(--ink-soft);font-size:12.5px;}
.emptyState{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabs button{flex:none;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.gaugeWrap{margin-top:6px;}
.gaugeTrack{height:14px;background:#EDEAE0;border-radius:10px;overflow:hidden;position:relative;}
.gaugeFill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--green),#7fc7a5);}
.miniBox{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.miniBox:last-child{border-bottom:none;}
.progressBar{height:8px;background:#EDEAE0;border-radius:6px;overflow:hidden;margin-top:6px;}
.progressFill{height:100%;background:var(--gold);}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calGrid .dh{font-size:10px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
.calDay{aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.calDay.today{border-color:var(--gold);border-width:2px;}
.calDay .dots{display:flex;gap:2px;position:absolute;bottom:4px;}
.dot{width:5px;height:5px;border-radius:50%;}
.dot.inc{background:var(--green);} .dot.exp{background:var(--red);} .dot.card{background:var(--gold);}
.linkline{background:none;border:none;color:var(--teal);font-size:13px;font-weight:600;text-decoration:underline;padding:6px 0;}
.alertItem{display:flex;gap:10px;padding:12px;border-radius:12px;margin-bottom:8px;}
.alertItem.warn{background:var(--gold-soft);} .alertItem.danger{background:var(--red-soft);} .alertItem.info{background:var(--green-soft);}
.alertItem .ic{font-size:18px;}
.alertItem .txt b{display:block;font-size:13.5px;} .alertItem .txt span{font-size:12px;color:var(--ink-soft);}
canvas{width:100%;display:block;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s;}
.toast.show{opacity:1;}
.searchBar{display:flex;gap:8px;margin-bottom:10px;}
.searchBar input{flex:1;}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}
</style>

<script>/* State persistence: compact synchronous checkpoint + full transactional IndexedDB copy. */
window.DBStore={tail:Promise.resolve(),ready:false,localError:null,lastError:null,stamp:0};
DBStore.safeGet=function(key){try{return localStorage.getItem(key)}catch{return null}};
DBStore.valid=x=>!!(x&&typeof x==='object'&&Number.isFinite(Number(x.saldo))&&Array.isArray(x.lancamentos)&&Array.isArray(x.cards));
DBStore.readLocal=function(){for(const key of ['dioneData2','dbStatePrevious']){try{const x=JSON.parse(DBStore.safeGet(key)||'null');if(DBStore.valid(x)){DBStore.from=key;return x}}catch{}}DBStore.from='empty';return null};
DBStore.open=function(){if(DBStore.dbPromise)return DBStore.dbPromise;DBStore.dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('Armazenamento de dados indisponível'));const request=indexedDB.open('DBPersonalData',1);request.onupgradeneeded=()=>{request.result.createObjectStore('state')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Feche outras abas antigas do app e tente novamente'))});return DBStore.dbPromise};
DBStore.read=async function(){const db=await DBStore.open();return new Promise((resolve,reject)=>{const tx=db.transaction('state','readonly'),req=tx.objectStore('state').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})};
DBStore.write=async function(envelope){const db=await DBStore.open();return new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite'),store=tx.objectStore('state');store.put(envelope,'current');tx.oncomplete=()=>resolve(true);tx.onabort=()=>reject(tx.error||Error('Não foi possível gravar'));tx.onerror=()=>{}})};
DBStore.status=function(text,error=false){let box=document.getElementById('db-storage-status');if(!box){box=document.createElement('div');box.id='db-storage-status';box.setAttribute('role','status');document.querySelector('#app header').after(box)}box.textContent=text;box.classList.toggle('db-store-error',error);DBStore.lastError=error?text:null};
DBStore.checkpoint=function(data){const {undoSnapshots,...compact}=data;try{const previous=localStorage.getItem('dioneData2');localStorage.setItem('dioneData2',JSON.stringify(compact));localStorage.setItem('dbStateSavedAt',String(DBStore.stamp));if(previous&&DBStore.valid(JSON.parse(previous)))try{const old=JSON.parse(previous);delete old.undoSnapshots;localStorage.setItem('dbStatePrevious',JSON.stringify(old))}catch{}DBStore.localError=null;return true}catch(e){DBStore.localError=e;return false}};
DBStore.persist=function(data){const copy=JSON.parse(JSON.stringify(data));DBStore.stamp=Math.max(Date.now(),DBStore.stamp+1);const savedAt=DBStore.stamp;const checkpoint=DBStore.checkpoint(copy);DBStore.tail=DBStore.tail.catch(()=>{}).then(()=>DBStore.write({data:copy,savedAt})).then(()=>{DBStore.status('Dados salvos neste aparelho · '+new Date(savedAt).toLocaleTimeString('pt-BR'));return true}).catch(e=>{DBStore.status(checkpoint?'Dados salvos na cópia local. Histórico completo indisponível; exporte um backup.':'Não foi possível salvar neste aparelho. Exporte um backup antes de fechar.',true);return checkpoint});return DBStore.tail};
DBStore.flush=()=>DBStore.tail;
DBStore.init=async function(){const input=document.getElementById('lockInput'),enter=document.querySelector('#lockScreen button'),bio=document.getElementById('db-bio-unlock');input.disabled=true;enter.disabled=true;if(bio)bio.disabled=true;const local=DBStore.readLocal();try{const disk=await DBStore.read();const localStamp=Number(DBStore.safeGet('dbStateSavedAt')||0);if(disk&&DBStore.valid(disk.data)&&(!local||disk.savedAt>=localStamp)){state=disk.data;DBStore.from='indexedDB';DBStore.stamp=disk.savedAt}else if(local)state=local;DB.normalize();DBStore.ready=true;if(DBStore.from!=='empty'){await DBStore.persist(state)}else DBStore.status('Nenhum dado salvo neste endereço. Restaure o backup de 03/11.',true)}catch(e){DB.normalize();DBStore.ready=true;DBStore.status(local?'Cópia local carregada.':'Restaure o backup de 03/11 para recuperar suas informações.',!local)}finally{input.disabled=false;enter.disabled=false;if(bio)bio.disabled=false;DBStore.ready=true;DB.bioUI?.();if(location.protocol==='file:')DBStore.status('Abra o endereço HTTPS do app publicado no GitHub. Arquivos baixados têm armazenamento separado.',true)}};
</script>
<script>

/* ================= DATA MODEL ================= */
const CATS_IN = ["Salário","Aluguel","Vale","Freelance","Reembolso","Vendas","Outras entradas"];
const CATS_OUT = ["Moradia","Condomínio","Água","Luz","Gás","Internet","Telefone","Alimentação","Supermercado","Transporte","Combustível","Saúde","Farmácia","Educação","Vestuário","Lazer","Assinaturas/Streaming","Cartão","Cigarros","Jogos/Loterias","Pets","Presentes","Impostos/Taxas","Manutenção","Beleza/Cuidados pessoais","Empréstimo","Dívidas","Caixinha","Outras despesas"];

const DEFAULT_STATE = () => ({
  password: "1234",
  saldo: 0,
  pendingSalaryDeduction: 0,
  categoriesIn: CATS_IN.slice(),
  categoriesOut: CATS_OUT.slice(),
  lancamentos: [], // {id,desc,category,amount,type:'entrada'|'saida',date,purchaseDate,status,installments,installmentNum,groupId,cardId,receipt,trashed,applied}
  cards: [
    {id:"card_main", name:"Cartão de Crédito Nubank Dione", limit:350, dueDay:12, bestDay:5, closingDay:null, invoices:[]},
    {id:"card_shopee", name:"Shopee", limit:500, dueDay:6, bestDay:27, closingDay:26, invoices:[]},
  ],
  loan: {id:"loan1", total:1000, installmentsCount:12, installmentValue:150, dueDay:8, nextDate:"2026-09-08", paidCount:0},
  debts: [],
  boxes: [
    {id:"box_vitoria", name:"Vitória", goal:5000, balance:20, monthlyPlan:0, contributions:[]},
  ],
  movements: [],
  history: [],
  trash: [],
  closings: [],
  undoSnapshots: [],
});

let state = load();
if(state.pendingSalaryDeduction===undefined) state.pendingSalaryDeduction = 0;
function load(){ return DBStore.readLocal() || DEFAULT_STATE(); }
function save(){if(window.DBStore)DBStore.persist(state);}

function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function localDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
function todayStr(){ return localDateStr(new Date()); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function addMonthsIso(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setMonth(d.getMonth()+n); return localDateStr(d); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function logHist(text){ state.history.unshift({id:uid('h'), ts:new Date().toISOString(), text}); if(state.history.length>500) state.history.pop(); }
function pushMovement(type, desc, amount){ state.movements.unshift({id:uid('mov'), ts:new Date().toISOString(), type, desc, amount}); if(state.movements.length>400) state.movements.pop(); }
function snapshot(){ state.undoSnapshots.push(JSON.stringify({saldo:state.saldo,lancamentos:state.lancamentos,cards:state.cards,loan:state.loan,debts:state.debts,boxes:state.boxes,movements:state.movements})); if(state.undoSnapshots.length>20) state.undoSnapshots.shift(); }
function undoLast(){
  if(!state.undoSnapshots.length){ toast("Nada para desfazer"); return; }
  const s = JSON.parse(state.undoSnapshots.pop());
  Object.assign(state, s);
  save(); logHist("Última ação desfeita"); render(); toast("Última ação desfeita");
}
["Cigarros","Farmácia"].forEach(()=>{}); // no-op placeholder to keep structure stable

/* ================= LOCK ================= */
function tryUnlock(){
  const val = document.getElementById('lockInput').value;
  if(val === state.password){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    runAuto();
    render();
  } else {
    document.getElementById('lockErr').textContent = "Senha incorreta";
  }
}
function lockApp(){
  document.getElementById('lockInput').value='';
  document.getElementById('lockErr').textContent='';
  document.getElementById('app').style.display='none';
  document.getElementById('lockScreen').style.display='flex';
}
function forgotPw(){
  const np = prompt("Redefinir localmente. Digite a nova senha:");
  if(np){ state.password = np; save(); toast("Senha redefinida"); }
}
document.getElementById('lockInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

/* ================= NAV ================= */
const NAV = [
  {id:"situacao", label:"Início", ic:"🏠"},
  {id:"lancamentos", label:"Entradas e Saídas", ic:"🔄"},
  {id:"cartoes", label:"Cartões", ic:"💳"},
  {id:"emprestimo", label:"Empréstimo e Dívidas", ic:"📉"},
  {id:"caixinhas", label:"Caixinhas", ic:"🐷"},
  {id:"previsao", label:"Previsão de pagamentos", ic:"🧮"},
  {id:"projecao", label:"Projeção do próximo mês", ic:"🔮"},
  {id:"historico", label:"Histórico", ic:"🕘"},
  {id:"calendario", label:"Calendário", ic:"📅"},
  {id:"relatorios", label:"Relatórios", ic:"📊"},
  {id:"fechamento", label:"Fechamento mensal", ic:"📁"},
];
function buildNav(){
  document.getElementById('navList').innerHTML = NAV.map(n=>
    `<div class="navItem ${n.id===currentTab?'active':''}" onclick="goTab('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</div>`
  ).join("");
}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', open);
  document.getElementById('drawerOverlay').classList.toggle('show', open);
}
function goTab(id){ currentTab=id; toggleDrawer(false); closeSheet(); document.getElementById('didiPanel')?.classList.remove('open'); if(window.DB)DB.stopVoice?.(); render(); const content=document.getElementById('content'); if(content)content.scrollTop=0; }

/* ================= HELPERS ================= */
function cardById(id){ return state.cards.find(c=>c.id===id); }
function boxById(id){ return state.boxes.find(b=>b.id===id); }
function activeLanc(){ return state.lancamentos.filter(l=>!l.trashed); }
function pendingLanc(){ return activeLanc().filter(l=>!l.applied); }

function computeCardDueDate(purchaseDateStr, card){
  if(!card || !card.closingDay || !card.dueDay) return purchaseDateStr;
  const d = new Date(purchaseDateStr+"T00:00:00");
  let closingMonth = d.getMonth(), closingYear = d.getFullYear();
  if(d.getDate() >= card.closingDay){ closingMonth += 1; if(closingMonth>11){ closingMonth=0; closingYear+=1; } }
  let dueMonth = closingMonth, dueYear = closingYear;
  if(card.dueDay <= card.closingDay){ dueMonth += 1; if(dueMonth>11){ dueMonth=0; dueYear+=1; } }
  const lastDay = daysInMonth(dueYear, dueMonth);
  const effDay = Math.min(card.dueDay, lastDay);
  return localDateStr(new Date(dueYear, dueMonth, effDay));
}

function applyLancEffect(l){
  if(l.type==='entrada'){
    if(l.category==='Vale'){
      state.saldo += Number(l.amount||0);
      state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction||0) + Number(l.amount||0);
      pushMovement('credito', `${l.category}: ${l.desc}`, l.amount);
    } else if(l.category==='Salário'){
      let amt = Number(l.amount||0);
      let consumed = 0;
      if(Number(state.pendingSalaryDeduction||0) > 0){
        consumed = Math.min(amt, Number(state.pendingSalaryDeduction));
        amt -= consumed;
        state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction) - consumed;
      }
      l._consumedVale = consumed;
      l._creditedAmount = amt;
      state.saldo += amt;
      pushMovement('credito', `${l.category}: ${l.desc}${consumed>0?` (descontado ${DB.rawMoney(consumed)} de vale)`:''}`, amt);
    } else {
      state.saldo += Number(l.amount||0);
      pushMovement('credito', `${l.category}: ${l.desc}`, l.amount);
    }
  } else {
    state.saldo -= Number(l.amount||0);
    pushMovement('debito', `${l.category}: ${l.desc}`, l.amount);
  }
  l.applied = true;
  l.status = 'realizado';
}
function unapplyLancEffect(l){
  if(l.type==='entrada'){
    if(l.category==='Vale'){
      state.saldo -= Number(l.amount||0);
      state.pendingSalaryDeduction = Math.max(0, Number(state.pendingSalaryDeduction||0) - Number(l.amount||0));
      pushMovement('debito', `Estorno: ${l.desc}`, l.amount);
    } else if(l.category==='Salário'){
      const credited = l._creditedAmount!=null ? l._creditedAmount : Number(l.amount||0);
      state.saldo -= credited;
      if(l._consumedVale){ state.pendingSalaryDeduction = Number(state.pendingSalaryDeduction||0) + Number(l._consumedVale); }
      pushMovement('debito', `Estorno: ${l.desc}`, credited);
      l._consumedVale = 0; l._creditedAmount = null;
    } else {
      state.saldo -= Number(l.amount||0);
      pushMovement('debito', `Estorno: ${l.desc}`, l.amount);
    }
  } else {
    state.saldo += Number(l.amount||0);
    pushMovement('credito', `Estorno: ${l.desc}`, l.amount);
  }
  l.applied = false;
}
function runAutoLancamentos(){
  const today = todayStr();
  let changed = false;
  activeLanc().forEach(l=>{
    if(!l.applied && l.date && l.date<=today){
      applyLancEffect(l);
      logHist(`${l.type==='entrada'?'Entrada':'Saída'} vencida aplicada: ${l.desc} (${fmt(l.amount)})`);
      changed = true;
    }
  });
  if(changed) save();
}
function runAutoDebts(){
  const today = todayStr();
  let changed = false;
  state.debts.forEach(d=>{
    if(!d.paid && d.dueDate && d.dueDate<=today){
      state.saldo -= Number(d.amount||0);
      d.paid = true;
      const lc = {id:uid('lc'),type:'saida',desc:`Dívida: ${d.desc}`,category:'Dívidas',amount:Number(d.amount||0),date:d.dueDate,purchaseDate:d.dueDate,status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true};
      state.lancamentos.push(lc);
      d._lancId = lc.id;
      logHist(`Dívida vencida abatida automaticamente: ${d.desc} (${fmt(d.amount)})`);
      pushMovement('debito', `Dívida: ${d.desc}`, d.amount);
      changed = true;
    }
  });
  if(changed) save();
}
function runAuto(){ runAutoLancamentos(); runAutoDebts(); }

function monthlyPendingSaidas(ym){
  let total = pendingLanc().filter(l=>l.type==='saida' && l.date && l.date.slice(0,7)===ym).reduce((s,l)=>s+Number(l.amount||0),0);
  if(state.loan.paidCount < state.loan.installmentsCount && state.loan.nextDate && state.loan.nextDate.slice(0,7)===ym){
    total += Number(state.loan.installmentValue||0);
  }
  state.debts.filter(d=>!d.paid && d.dueDate && d.dueDate.slice(0,7)===ym).forEach(d=> total += Number(d.amount||0));
  return total;
}
function monthlyPendingEntradas(ym){
  return pendingLanc().filter(l=>l.type==='entrada' && l.date && l.date.slice(0,7)===ym).reduce((s,l)=>s+Number(l.amount||0),0);
}
function quantoPodeGastar(){
  const ym = todayStr().slice(0,7);
  return state.saldo - monthlyPendingSaidas(ym);
}
function caixinhasTotal(){ return state.boxes.reduce((s,b)=>s+Number(b.balance||0),0); }
function dividasTotal(){ return state.debts.filter(d=>!d.paid).reduce((s,d)=>s+Number(d.amount||0),0); }
function loanRemaining(){ const l=state.loan; return Math.max(0,(l.installmentsCount-l.paidCount))*l.installmentValue; }
function patrimonioTotal(){ return state.saldo + caixinhasTotal() - dividasTotal() - loanRemaining(); }
function totalMesPorTipo(ym, tipo){
  return activeLanc().filter(l=>l.applied && l.type===tipo && l.date && l.date.slice(0,7)===ym)
    .reduce((s,l)=> s + (tipo==='entrada' && l._creditedAmount!=null ? Number(l._creditedAmount) : Number(l.amount||0)), 0);
}

function allPendingCommitments(){
  const list = [];
  pendingLanc().forEach(l=> list.push({date:l.date, desc:l.desc, amount:Number(l.amount||0), type:l.type==='entrada'?'entrada':'despesa', ref:l.id}));
  if(state.loan.paidCount < state.loan.installmentsCount){
    let d = state.loan.nextDate;
    for(let i=state.loan.paidCount; i<state.loan.installmentsCount; i++){
      list.push({date:d, desc:'Parcela do empréstimo', amount:Number(state.loan.installmentValue||0), type:'emprestimo'});
      d = addMonthsIso(d,1);
    }
  }
  state.debts.filter(d=>!d.paid).forEach(d=> list.push({date:d.dueDate||todayStr(), desc:`Dívida: ${d.desc}`, amount:Number(d.amount||0), type:'divida', noDate:!d.dueDate}));
  state.cards.forEach(c=>{
    (c.invoices||[]).forEach(inv=>{
      const restante = Math.max(0, inv.amount - inv.paidAmount);
      if(restante > 0.009){
        const [yy,mm] = inv.month.split('-').map(Number);
        const lastDay = daysInMonth(yy, mm-1);
        const effDay = Math.min(c.dueDay||1, lastDay);
        list.push({date:`${inv.month}-${String(effDay).padStart(2,'0')}`, desc:`Fatura ${c.name} (${inv.month})`, amount:restante, type:'fatura'});
      }
    });
  });
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

function monthlyNetEstimate(){
  const realizadas = activeLanc().filter(l=>l.applied);
  const months = new Set(realizadas.map(l=>l.date.slice(0,7)));
  const nMonths = Math.max(1, months.size);
  const entradasMedia = realizadas.filter(l=>l.type==='entrada').reduce((s,l)=>s+Number(l.amount||0),0) / nMonths;
  const saidasMedia = realizadas.filter(l=>l.type==='saida').reduce((s,l)=>s+Number(l.amount||0),0) / nMonths;
  const loanM = state.loan.paidCount<state.loan.installmentsCount? state.loan.installmentValue:0;
  const boxesM = state.boxes.reduce((s,b)=>s+Number(b.monthlyPlan||0),0);
  return entradasMedia - saidasMedia - loanM - boxesM;
}

function drawProjectionChart(canvasId, months){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.parentElement.clientWidth; canvas.width = w; canvas.height=140;
  ctx.clearRect(0,0,w,140);
  const net = monthlyNetEstimate();
  const base = state.saldo;
  const pts = [];
  for(let i=0;i<=months;i++) pts.push(base + net*i);
  const min = Math.min(...pts,0), max = Math.max(...pts,1);
  const pad = 20;
  const xstep = (w-pad*2)/months;
  ctx.strokeStyle = '#0F3D3E'; ctx.lineWidth=2.5; ctx.beginPath();
  pts.forEach((v,i)=>{
    const x = pad+i*xstep;
    const y = 120 - ((v-min)/(max-min||1))*100;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  [6,9,12].forEach(m=>{
    if(m>months) return;
    const x = pad+m*xstep; const y = 120-((pts[m]-min)/(max-min||1))*100;
    ctx.fillStyle='#C9973A'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    ctx.fillStyle='#132C2A'; ctx.font='11px Inter'; ctx.textAlign='center';
    ctx.fillText(m+'m: '+fmt(pts[m]).replace('R$',''), x, y-10);
  });
  ctx.strokeStyle='#E4E0D3'; ctx.beginPath(); ctx.moveTo(pad,120); ctx.lineTo(w-pad,120); ctx.stroke();
}

function saveLanc(id){
  const type = document.getElementById('f_type_es').value;
  const desc = document.getElementById('f_desc').value.trim();
  const category = document.getElementById('f_cat').value;
  const amount = DB.parseAmount(document.getElementById('f_amount').value)||0;
  const date = document.getElementById('f_date').value;
  const status = document.getElementById('f_status').value;
  const ptypeEl = document.getElementById('f_ptype');
  const cardEl = document.getElementById('f_card');
  const cardId = (type==='saida' && cardEl && cardEl.value) ? cardEl.value : null;
  const installments = (type==='saida' && ptypeEl && ptypeEl.value==='parcelado') ? Math.max(2, parseInt(document.getElementById('f_installments').value,10)||2) : 1;
  if(!desc || amount<=0 || !date){ toast("Preencha descrição, valor e data"); return; }
  const card = cardId ? cardById(cardId) : null;
  const hasCycle = card && card.closingDay && card.dueDay;
  const firstDueDate = hasCycle ? computeCardDueDate(date, card) : date;
  const fileInput = document.getElementById('f_receipt');
  const finish = (receiptData)=>{
    snapshot();
    if(id){
      const l = state.lancamentos.find(x=>x.id===id);
      if(l.applied){ unapplyLancEffect(l); }
      Object.assign(l,{type,desc,category,amount,date:firstDueDate,purchaseDate:date,status,cardId,applied:false});
      if(receiptData) l.receipt = receiptData;
      if(status==='realizado'){ applyLancEffect(l); }
      logHist(`Lançamento editado: ${desc}`);
    } else if(installments>1){
      const groupId = uid('grp');
      const per = Math.round((amount/installments)*100)/100;
      let firstRecord = null;
      for(let n=1;n<=installments;n++){
        const dDate = n===1 ? firstDueDate : addMonthsIso(firstDueDate, n-1);
        let stat = n===1 ? status : 'previsto';
        // Keep the status explicitly selected by the user.
        const rec = {id:uid('lc'),type,desc,category,amount:DB.installmentAmount(amount,installments,n),date:dDate,purchaseDate:date,status:stat,installments,installmentNum:n,groupId,cardId,receipt:n===1?receiptData:null,trashed:false,applied:false};
        state.lancamentos.push(rec);
        if(n===1) firstRecord = rec;
      }
      if(firstRecord && firstRecord.status==='realizado'){ applyLancEffect(firstRecord); }
      logHist(`Saída parcelada criada: ${desc} (${installments}x)`);
    } else {
      const rec = {id:uid('lc'),type,desc,category,amount,date:firstDueDate,purchaseDate:date,status,installments:1,installmentNum:1,groupId:null,cardId,receipt:receiptData,trashed:false,applied:false};
      state.lancamentos.push(rec);
      if(status==='realizado'){ applyLancEffect(rec); }
      logHist(`${type==='entrada'?'Entrada':'Saída'} criada: ${desc}`);
    }
    save();
    runAuto();
    closeSheet(); render(); toast("Salvo");
  };
  if(fileInput && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=> finish(reader.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else finish(null);
}
function deleteLanc(id){
  snapshot();
  const l = state.lancamentos.find(x=>x.id===id);
  if(l.applied) unapplyLancEffect(l);
  l.trashed = true; l.applied = false;
  state.trash.push({...l, deletedAt:new Date().toISOString()});
  logHist(`Lançamento movido para lixeira: ${l.desc}`);
  save(); closeSheet(); render(); toast("Movido para a lixeira");
}
function applyLancNow(id){
  snapshot();
  const l = state.lancamentos.find(x=>x.id===id);
  if(l.applied) return;
  applyLancEffect(l);
  logHist(`Aplicado manualmente: ${l.desc} (${fmt(l.amount)})`);
  save(); render(); toast("Aplicado ao saldo");
}
function unapplyLancNow(id){
  snapshot();
  const l = state.lancamentos.find(x=>x.id===id);
  if(!l.applied) return;
  unapplyLancEffect(l);
  l.status = 'previsto';
  logHist(`Desfeito: ${l.desc} (${fmt(l.amount)})`);
  save(); render(); toast("Desfeito");
}

function payLoanInstallment(){
  snapshot();
  state.saldo -= state.loan.installmentValue;
  state.loan.paidCount++;
  const d = new Date(state.loan.nextDate+"T00:00:00"); d.setMonth(d.getMonth()+1);
  state.loan.nextDate = localDateStr(d);
  state.lancamentos.push({id:uid('lc'),type:'saida',desc:'Parcela do empréstimo',category:'Empréstimo',amount:state.loan.installmentValue,date:todayStr(),purchaseDate:todayStr(),status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true});

  save(); render(); toast("Parcela marcada como paga");

function toggleDebtPaid(id){
  snapshot();
  const d=state.debts.find(x=>x.id===id);
  d.paid=!d.paid;
  if(d.paid){
    state.saldo -= Number(d.amount||0);
    const lc = {id:uid('lc'),type:'saida',desc:`Dívida: ${d.desc}`,category:'Dívidas',amount:Number(d.amount||0),date:todayStr(),purchaseDate:todayStr(),status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:true};
    state.lancamentos.push(lc);
    d._lancId = lc.id;
    logHist(`Dívida quitada: ${d.desc}`);
    pushMovement('debito', `Dívida: ${d.desc}`, d.amount);
  } else {
    state.saldo += Number(d.amount||0);
    if(d._lancId){ const lc = state.lancamentos.find(x=>x.id===d._lancId); if(lc) lc.trashed = true; d._lancId=null; }
    logHist(`Dívida reaberta: ${d.desc}`);
    pushMovement('credito', `Estorno dívida: ${d.desc}`, d.amount);
  }
  save(); render();
}

  const it = id? state.debts.find(d=>d.id===id) : {desc:'',amount:'',dueDate:''};
  openSheet(`${id?'Editar':'Nova'} dívida`, `

    </div>`);

function saveDebt(id){
  const desc=document.getElementById('f_desc').value.trim();
  const amount=parseFloat(document.getElementById('f_amount').value)||0;
  const dueDate=document.getElementById('f_date').value;
  if(!desc||amount<=0){ toast("Preencha os campos"); return; }
  snapshot();
  if(id){
    const d = state.debts.find(x=>x.id===id);
    if(d.paid){
      state.saldo += Number(d.amount||0);
      state.saldo -= amount;
      if(d._lancId){
        const lc = state.lancamentos.find(x=>x.id===d._lancId);
        if(lc){ lc.amount = amount; lc.desc = `Dívida: ${desc}`; if(dueDate) lc.date = dueDate; }
      }
      pushMovement('debito', `Ajuste dívida: ${desc}`, amount - Number(d.amount||0));
    }
    d.desc = desc; d.amount = amount; d.dueDate = dueDate;
    logHist(`Dívida editada: ${desc}`);
  } else {
    state.debts.push({id:uid('debt'),desc,amount,dueDate,paid:false});
    logHist(`Dívida criada: ${desc}`);
  }
  save(); closeSheet(); render();
}
function deleteDebt(id){
  snapshot();
  const d = state.debts.find(x=>x.id===id);
  if(d.paid){
    state.saldo += Number(d.amount||0);
    if(d._lancId){ const lc = state.lancamentos.find(x=>x.id===d._lancId); if(lc) lc.trashed = true; }
    pushMovement('credito', `Estorno dívida excluída: ${d.desc}`, d.amount);
  }
  state.debts = state.debts.filter(x=>x.id!==id);
  logHist(`Dívida excluída: ${d.desc}`);
  save(); closeSheet(); render();
}

/* ================= PREVISÃO DE PAGAMENTOS ================= */
function renderPrevisao(){
  const pending = allPendingCommitments();
  const saidas = pending.filter(p=>p.type!=='entrada');
  const entradas = pending.filter(p=>p.type==='entrada');
  const totalPrevisto = saidas.reduce((s,p)=>s+p.amount,0);
  const totalEntradasPrev = entradas.reduce((s,p)=>s+p.amount,0);
  const saldo = state.saldo;
  const resultado = saldo - totalPrevisto + totalEntradasPrev;
  const byMonth = {};
  saidas.forEach(p=>{ const m=p.date.slice(0,7); byMonth[m]=(byMonth[m]||0)+p.amount; });
  const byMonthIn = {};
  entradas.forEach(p=>{ const m=p.date.slice(0,7); byMonthIn[m]=(byMonthIn[m]||0)+p.amount; });
  const months = [...new Set([...Object.keys(byMonth), ...Object.keys(byMonthIn)])].sort();
  const icon = {despesa:'🧾', emprestimo:'📉', divida:'⚠️', fatura:'💳', entrada:'💰'};
  return `<div class="card">
    <h3>Resumo geral</h3>
    <div class="row"><span>Saldo atual</span><b>${fmt(saldo)}</b></div>
    <div class="row"><span>Total previsto a pagar</span><b style="color:var(--red)">${fmt(totalPrevisto)}</b></div>
    <div class="row"><span>Total previsto a receber</span><b style="color:var(--green)">${fmt(totalEntradasPrev)}</b></div>
    <hr class="sep">
    <div class="row"><span><b>${resultado>=0?'Sobra de saldo':'Falta de saldo'}</b></span><b class="big" style="font-size:20px;color:${resultado>=0?'var(--green)':'var(--red)'}">${fmt(resultado)}</b></div>
  </div>
  <div class="card">
    <h3>Total por mês (a pagar / a receber)</h3>
    ${months.length? months.map(m=>`<div class="row"><span>${m}</span><b>${byMonthIn[m]?`<span style="color:var(--green)">+${fmt(byMonthIn[m])}</span> `:''}${byMonth[m]?`<span style="color:var(--red)">-${fmt(byMonth[m])}</span>`:''}</b></div>`).join(''):'<div class="emptyState">Nenhum pagamento previsto.</div>'}
  </div>

function drawCalendar(){

  const first = new Date(y,m,1); const startDow = first.getDay();
  const daysInM = new Date(y,m+1,0).getDate();
  const todayIso = todayStr();
  let html = ['D','S','T','Q','Q','S','S'].map(d=>`<div class="dh">${d}</div>`).join('');

  for(let d=1; d<=daysInM; d++){

    const hasInc = activeLanc().some(l=>l.date===iso && l.type==='entrada');

  }

/* ================= BACKUP (EXPORTAR / IMPORTAR) ================= */
function exportBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url; a.download = `dione-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toggleDrawer(false);
  toast("Backup exportado");
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast("Arquivo inválido"); return; }
    if(!parsed || parsed.saldo===undefined){ toast("Este arquivo não parece um backup válido"); return; }
    const ok = confirm("Importar este backup vai SUBSTITUIR todos os dados atuais do app. Deseja continuar?");
    if(!ok){ event.target.value=""; return; }
    state = parsed;
    if(!state.undoSnapshots) state.undoSnapshots = [];
    save();
    toggleDrawer(false);
    render();
    toast("Backup importado com sucesso");
    event.target.value = "";
  };
  reader.readAsText(file);
}
function resetAllData(){
  const ok1 = confirm("Isso vai APAGAR TUDO: saldo, lançamentos, cartões, empréstimo, dívidas e caixinhas. Não tem como desfazer. Deseja continuar?");

  state = DEFAULT_STATE();

  toast("Todos os dados foram apagados");
}

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
<script>(function(){
  function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
  function monthKey(){return new Date().toISOString().slice(0,7)}
  function active(){return (state.lancamentos||[]).filter(x=>!x.trashed)}
  function findCat(text,type){
    const cats=(type==='entrada'?state.categoriesIn:state.categoriesOut)||[]; const t=text.toLowerCase();
    return cats.find(c=>t.includes(c.toLowerCase())) || cats.find(c=>c.toLowerCase().split(/\s+/).some(w=>w.length>3&&t.includes(w))) || null;
  }
  function say(msg){ if(window.DB){DB.say(msg);return;}const box=document.querySelector('#didiBody'); if(!box)return; const d=document.createElement('div');d.className='didiMsg didiBot';d.textContent=msg;box.appendChild(d);box.scrollTop=box.scrollHeight;}
  function user(msg){const box=document.querySelector('#didiBody');const d=document.createElement('div');d.className='didiMsg didiUser';d.textContent=msg;box.appendChild(d);box.scrollTop=box.scrollHeight;}
  function parseAmount(s){let m=s.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[\.,]\d{1,2})?)/i); if(!m)return null; let x=m[1]; if(x.includes(',')&&x.includes('.'))x=x.replace(/\./g,'').replace(',','.'); else x=x.replace(',','.'); return Number(x)}
  function register(type, amount, category, desc){
    snapshot(); const date=todayStr(); const rec={id:uid('lc'),type,desc:desc||category,category:category||'Outras despesas',amount,date,purchaseDate:date,status:'realizado',installments:1,installmentNum:1,groupId:null,cardId:null,receipt:null,trashed:false,applied:false}; state.lancamentos.push(rec); applyLancEffect(rec); logHist(`${type==='entrada'?'Entrada':'Saída'} criada pela DIdI: ${rec.desc}`); save(); render();
  }
  function handle(text){
    text=text.trim(); if(!text)return;
    if(!window.DBDispatching)user(text); const t=text.toLowerCase();
    if(/\b(desfaz|desfazer|undo)\b/.test(t)){undoLast();say('Pronto, Jhony. Desfiz a última ação.');return;}
    if(/\b(saldo|quanto tenho|quanto tenho na conta)\b/.test(t)){say(`Seu saldo atual é ${money(state.saldo)}.`);return;}
    if(/quanto (gastei|saiu)|gastos? (do|desse) mês|saídas? (do|desse) mês/.test(t)){const k=monthKey();const v=active().filter(x=>x.type==='saida'&&String(x.date).startsWith(k)).reduce((a,x)=>a+Number(x.amount||0),0);say(`Neste mês, suas saídas registradas somam ${money(v)}.`);return;}

    if(amount && (isIn||isOut)){
